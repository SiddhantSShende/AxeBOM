# EncoreBOM frontend — static SPA plus an /api reverse proxy.
#
# This file replaces the Vite dev-server proxy (frontend/vite.config.ts) when
# the frontend runs as a container. The two must agree: both forward /api to
# the gateway and both must upgrade WebSockets, or scan progress silently
# stops working in one environment and not the other.

# $connection_upgrade must be "upgrade" for a WebSocket handshake and "close"
# otherwise. Hardcoding "upgrade" breaks keep-alive for ordinary requests;
# omitting it entirely breaks the WebSocket. This map is the standard idiom and
# must live in the http context, which is where conf.d files are included.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       8085;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version in the Server header.
    server_tokens off;

    # ------------------------------------------------------------------ api
    # The gateway strips /api itself, so the prefix is forwarded intact. Using
    # a variable for the host forces nginx to re-resolve DNS at request time
    # instead of caching the address at startup; without it, a gateway
    # container that restarts with a new IP is unreachable until nginx is
    # restarted too — which on a compose stack is most of the time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream http://gateway:8080;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;

        # WebSocket upgrade for GET /api/v1/scans/{id}/progress. Without these
        # three the handshake returns 200 with an HTML body and the client
        # reports a confusing parse error rather than a refused upgrade.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A scan progress socket is long-lived and a report render can take
        # minutes; the default 60s read timeout would sever both.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # The public share link is served by the report service and is NOT under
    # /api — it is a URL a person pastes into a browser.
    location /shared/ {
        set $shared_upstream http://gateway:8080;
        proxy_pass $shared_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------ the SPA
    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers loading a stale bundle that references deleted chunks.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths are SPA routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container-level liveness. Answers without touching the backend, matching
    # the /healthz convention used by the Go services.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"up","service":"frontend"}';
    }
}
