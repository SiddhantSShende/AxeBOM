# AxeBOM frontend — static SPA, an /api reverse proxy, and the ZITADEL
# canonical paths.
#
# This file replaces the Vite dev-server proxy (frontend/vite.config.ts) when
# the frontend runs as a container. The two must agree: both forward /api to
# the gateway, both upgrade WebSockets, and both hand ZITADEL its own paths —
# or authentication works in one environment and not the other.
#
# ---------------------------------------------------------------------------
# WHY ZITADEL IS SERVED FROM THIS ORIGIN AND NOT ITS OWN
#
# ZITADEL routes requests to a virtual instance by Host header, and its issuer
# is baked into every token. Serving it from http://localhost:5173 alongside
# the SPA means one origin, one issuer, no CORS on the token endpoint, and a
# redirect_uri that is same-site — so the login round trip does not depend on
# third-party cookie policy.
#
# ⚠ ZITADEL'S CANONICAL PATHS MUST STAY AT ROOT. /.well-known/openid-configuration
# and /oauth/v2/* are protocol-defined locations; putting them behind a prefix
# breaks discovery for every conforming client, ours included.
#
# ⚠ gRPC IS DELIBERATELY NOT PROXIED HERE. `axebom iam bootstrap` speaks
# gRPC and talks to the published API port directly (ZITADEL_API_PORT). Making
# nginx carry gRPC would need grpc_pass and an h2c upstream for one CLI that
# never runs in a browser. The browser paths below are all HTTP/1.1, including
# the console's grpc-web.

# $connection_upgrade must be "upgrade" for a WebSocket handshake and "close"
# otherwise. Hardcoding "upgrade" breaks keep-alive for ordinary requests;
# omitting it entirely breaks the WebSocket. This map is the standard idiom and
# must live in the http context, which is where conf.d files are included.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # ⚠ TEMPLATED, NOT HARDCODED. `deploy/docker/frontend-entrypoint.d/50-tls.sh`
    # rewrites these two placeholders at container start, turning TLS on only
    # when a cert is actually mounted at /etc/nginx/tls (deploy/compose/.data/tls,
    # written by `task tls:gen`) — the default flow (localhost, already a secure
    # context for crypto.subtle) needs none of this and must keep working with
    # nothing mounted there. A hardcoded `ssl_certificate` pointing at a file
    # that doesn't exist fails nginx's config test and the container never
    # starts, so this cannot be conditional inside nginx's own config language —
    # there is no `if` around a whole directive.
    listen       8085 __SSL_LISTEN_SUFFIX__;
    __SSL_CERTIFICATE_DIRECTIVES__
    server_name  _;

    # ------------------------------------------------------- canonical origin
    # ⚠ TEMPLATED LIKE THE TLS DIRECTIVES ABOVE. `frontend-entrypoint.d/
    # 40-canonical.sh` rewrites this placeholder at container start from
    # ZITADEL_PUBLIC_URL, or deletes it when that variable is unset.
    #
    # Reaching this stack on any host OTHER than the configured public URL is
    # a dead end, and both dead ends are silent about their real cause:
    #
    #   wrong scheme  http:// against a TLS listener is nginx's internal 497,
    #                 rendered as "400 The plain HTTP request was sent to
    #                 HTTPS port" — which names neither the right scheme nor
    #                 the right host.
    #   wrong host    https://localhost:5173 SERVES the app perfectly, then
    #                 fails at login with ZITADEL's "The requested redirect_uri
    #                 is missing in the client configuration", because the SPA
    #                 derives redirect_uri from window.location.origin
    #                 (frontend/src/lib/auth.ts) while ZITADEL matches the
    #                 registered URIs EXACTLY. The app looking fine right up
    #                 until the login button is what makes this one expensive.
    #
    # Both are the same mistake — a non-canonical origin — so both get the same
    # answer: redirect to the one origin this deployment is actually configured
    # for. That is also what keeps the single-origin property this file's header
    # depends on: ZITADEL only ever sees the canonical Host, so the issuer it
    # publishes cannot drift with whatever the visitor happened to type.
    #
    # 302, NOT 301: a permanent redirect is cached hard by the browser, and
    # this origin changes whenever ZITADEL_PUBLIC_URL does — a stale 301 would
    # send a developer to the previous deployment's host with no way to undo it
    # short of clearing site data.
    __CANONICAL_REDIRECT__

    root  /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version in the Server header.
    server_tokens off;

    # A variable upstream forces nginx to re-resolve DNS at request time instead
    # of caching the address at startup; without it, a container that restarts
    # with a new IP is unreachable until nginx restarts too — which on a compose
    # stack is most of the time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Inherited by every location below. ZITADEL in particular needs the public
    # Host verbatim: it selects the virtual instance from this header, and a
    # rewritten Host answers "Instance not found".
    proxy_http_version 1.1;
    # ⚠ $http_host, NOT $host. $host drops the port, so ZITADEL saw
    # "localhost" instead of "localhost:5173" and published an issuer of
    # http://localhost — which every token would then carry, and every client
    # would reject as a mismatch against the URL it actually called.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    # ------------------------------------------------------------------ api
    # The gateway strips /api itself, so the prefix is forwarded intact.
    location /api/ {
        set $upstream http://gateway:8080;
        proxy_pass $upstream$request_uri;

        # WebSocket upgrade for GET /api/v1/scans/{id}/progress. Without these
        # two the handshake returns 200 with an HTML body and the client
        # reports a confusing parse error rather than a refused upgrade.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A scan progress socket is long-lived and a report render can take
        # minutes; the default 60s read timeout would sever both.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # The public share link is served by the report service and is NOT under
    # /api — it is a URL a person pastes into a browser.
    location /shared/ {
        set $shared_upstream http://gateway:8080;
        proxy_pass $shared_upstream$request_uri;
    }

    # -------------------------------------------------------------- identity
    # The v4 login UI is a SEPARATE CONTAINER. `^~` so this wins over the
    # regex block below, which would otherwise claim /ui/... for the API.
    location ^~ /ui/v2/login {
        set $login_upstream http://zitadel-login:3000;
        proxy_pass $login_upstream$request_uri;
        proxy_read_timeout 120s;
    }

    # Everything ZITADEL's Go binary owns.
    #
    # ⚠ THIS LIST IS EXHAUSTIVE BY NECESSITY, NOT BY PREFERENCE. ZITADEL's own
    # router makes its REST gateway the catch-all and the reference deployment
    # gives it the whole domain, which we cannot do because the SPA owns `/`.
    # Anything ZITADEL adds at a new root path has to be added here too, and the
    # symptom of forgetting is the SPA's index.html served where JSON was
    # expected. Sourced from the v4.17.1 handler prefixes:
    #
    #   .well-known  oauth/v2  oidc/v1     OIDC discovery, authorize, token,
    #                                      keys, introspect, userinfo, revoke
    #   saml/v2  idps                      SAML, external IdP callbacks
    #   assets/v1                          instance branding assets — NOT the
    #                                      SPA's /assets/, which is hashed
    #                                      bundle output and matched by the
    #                                      shorter prefix location further down
    #   admin/v1 auth/v1 management/v1     v1 REST APIs (the console uses these)
    #   system/v1
    #   v2  v2beta                         v2 REST gateway (users, sessions, …)
    #   ui/console  ui/login  device       console SPA, legacy login, device flow
    #   debug  openapi                     health and API docs
    #
    # `auth/v1` is bounded by (/|$) on purpose: the AxeBOM SPA owns
    # /auth/callback and /auth/silent, and an unbounded /auth/ would swallow
    # both and break the login round trip in a way that looks like a routing
    # bug in the frontend router.
    location ~ ^/(\.well-known|oauth/v2|oidc/v1|saml/v2|idps|assets/v1|admin/v1|auth/v1|management/v1|system/v1|v2|v2beta|ui/console|ui/login|device|debug|openapi)(/|$) {
        set $zitadel_upstream http://zitadel-api:8080;
        proxy_pass $zitadel_upstream$request_uri;
        proxy_read_timeout 120s;
    }

    # Connect-RPC / grpc-web service paths, e.g. /zitadel.user.v2.UserService/…
    location ~ ^/zitadel\. {
        set $zitadel_rpc_upstream http://zitadel-api:8080;
        proxy_pass $zitadel_rpc_upstream$request_uri;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ------------------------------------------------------------ the SPA
    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers loading a stale bundle that references deleted chunks.
    #
    # This is a prefix location, so /assets/v1/... still reaches the regex
    # block above: nginx remembers the longest prefix match, then lets a
    # matching regex win.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        # ⚠ FOUR HEADERS, NOT ONE. Cache-Control alone is what a compliant
        # cache needs, but a caching proxy that ignores it — exactly what an
        # unusually persistent case of "hard refresh still shows the old
        # bundle" looks like, seen from outside this network — is by
        # definition not compliant. Pragma and Expires are the pre-HTTP/1.1
        # directives some older or more aggressive proxies still honor even
        # when they've been configured (or coded) to disregard Cache-Control;
        # ETag is removed so there is nothing left for a conditional request
        # to validate against and short-circuit with a 304 of stale content.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        etag off;
    }

    # Client-side routing: unknown paths are SPA routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container-level liveness. Answers without touching the backend, matching
    # the /healthz convention used by the Go services.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"up","service":"frontend"}';
    }
}
