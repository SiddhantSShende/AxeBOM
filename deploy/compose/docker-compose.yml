# ============================================================================
# AxeBOM — core stack
# ============================================================================
#   task dev          -> this file        (~4 GB RAM, laptop-friendly)
#   task dev:heavy    -> + docker-compose.heavy.yml  (~12-16 GB)
#
# SCOPE OF THIS FILE TODAY: infrastructure only. It is complete and works now.
# Application services are added by Phase 0, which creates their Dockerfiles —
# referencing build contexts that do not exist would break `docker compose up`
# for everyone, so they are deliberately absent rather than commented-out stubs.
#
# Windows: requires the WSL2 backend. Both WSL2 distros idle to `Stopped`;
# if `task dev` reports the daemon unreachable, start Docker Desktop or run
# `wsl -d docker-desktop`.
#
# PORTS: AxeBOM uses a dedicated 5xxxx range, not the service defaults.
# This machine already runs other projects that occupy 5432, 4222, 6379, 9000,
# 8200, 1025 and 8025 — every single default. Colliding would mean connecting
# to somebody else's Postgres and getting a confusing auth failure rather than
# an obvious "port in use". Every port is env-overridable.
# ============================================================================

name: axebom

x-healthcheck-defaults: &hc
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:

  # ------------------------------------------------------------------ postgres
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axebom}
      POSTGRES_USER: ${POSTGRES_USER:-axebom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axebom}
      # Deterministic collation. Locale drift between machines changes index
      # ordering, which changes keyset pagination results.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      # RLS is the only tenancy boundary (ADR-0006). Logging failed connections
      # makes a misconfigured role visible immediately rather than at breach time.
      - -c
      - log_connections=on
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axebom} -d ${POSTGRES_DB:-axebom}"]
      <<: *hc

  # ---------------------------------------------------------------------- nats
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    # Two NATS flag traps, both of which present as a crash loop that prints
    # usage text rather than an error:
    #   - flags are space-separated; `-sd=/data` is rejected outright
    #   - max_payload is a CONFIG-FILE option, not a CLI flag
    #
    # The 1 MB default payload is fine by design: ScanResultV1 carries artifact
    # REFERENCES (object-storage URIs plus sha256), never artifact bodies. If a
    # diagnostics array ever approaches the limit, that is a signal the result
    # is carrying data it should have uploaded. Phase 6 adds a config file if a
    # genuine need appears.
    command:
      - "-js"                      # JetStream: durable work queues
      - "-sd"
      - "/data"
      - "-m"
      - "8222"                     # monitoring
    ports: ["${NATS_PORT:-54222}:4222", "${NATS_MONITOR_PORT:-58222}:8222"]
    volumes: [natsdata:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      <<: *hc

  # --------------------------------------------------------------------- redis
  # Cache and rate limits ONLY. JetStream owns queueing — never put a queue here.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["${REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *hc

  # --------------------------------------------------------------------- minio
  # Raw scan artifacts are IMMUTABLE and never deleted (ADR-0003) — they are the
  # evidence that makes reports defensible and normalization replayable.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["${S3_PORT:-59000}:9000", "${S3_CONSOLE_PORT:-59001}:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      <<: *hc

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-axebom};
      mc version enable local/${S3_BUCKET:-axebom};
      echo 'bucket ready (versioned)';
      "
    restart: "no"

  # --------------------------------------------------------------------- vault
  # DEV MODE — in-memory, root token, no TLS. Never a production pattern.
  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports: ["${VAULT_PORT:-58200}:8200"]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      <<: *hc

  # ------------------------------------------------------------------- mailpit
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["${SMTP_PORT:-51025}:1025", "${MAILPIT_UI_PORT:-58025}:8025"]  # SMTP, web UI

  # --------------------------------------------------- observability (optional)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./otel-config.yaml:/etc/otel/config.yaml:ro"]
    ports: ["${OTLP_GRPC_PORT:-54317}:4317", "${OTLP_HTTP_PORT:-54318}:4318"]
    profiles: [observability]

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["${JAEGER_UI_PORT:-56686}:16686"]
    profiles: [observability]

# ============================================================================
# Volumes
# ============================================================================
volumes:
  pgdata:
  natsdata:
  miniodata:
  # NVD database cache for Dependency-Check (heavy profile).
  # First sync takes 30-60 minutes. Declared here so `task dev:nuke` prompts
  # before destroying it — losing this volume means paying that cost again.
  depcheck-data:

networks:
  default:
    name: axebom
