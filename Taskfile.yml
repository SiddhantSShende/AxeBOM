# AxeBOM — task runner
#
# Why go-task and not make/bash: the primary dev machine has no `make`, no
# preinstalled `task`, and PowerShell 5.1 (no `&&`, no ternary). go-task ships a
# single binary and runs identically everywhere, so nothing depends on which
# shell happens to be present.
#
#   winget install Task.Task    |    go install github.com/go-task/task/v3/cmd/task@latest
#
# Anything more complex than a few lines belongs in the `axebom` Go CLI, not
# here. See CLAUDE.md §Conventions — "No bash scripts".
#
# ---------------------------------------------------------------------------
# TARGETS MARKED [phase N] ARE NOT IMPLEMENTED YET.
# They fail with a clear message rather than silently passing. A check that
# passes without checking anything is worse than no check — it reads as green.
# ---------------------------------------------------------------------------

version: '3'

# ⚠ WITHOUT THIS, .env ONLY EVER REACHED docker compose (which reads it from
# the working directory on its own) — every host-run `go run ./cmd/axebom ...`
# command (db migrate/seed, iam bootstrap/verify) saw none of it and silently
# fell back to each flag's hardcoded default. Those defaults happen to match
# .env.example's own defaults, which is exactly what made the gap invisible:
# it only misbehaves once someone changes a value in .env, which is the entire
# point of the file existing. go-task fills in only variables not already set
# in the shell, so an explicit `export FOO=...` still wins over .env, same as
# every other dotenv tool.
dotenv: ['.env']

vars:
  # The full system: infrastructure plus the application tier. The two files
  # are layered rather than merged so `dev:infra` can still bring up only the
  # backing stores — the shape you want when running services from an IDE.
  COMPOSE: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.iam.yml -f deploy/compose/docker-compose.app.yml
  COMPOSE_INFRA: docker compose -f deploy/compose/docker-compose.yml
  # Identity on its own. ZITADEL must be up and bootstrapped before any service
  # can verify a token, so it is addressable without dragging the whole app tier
  # along — and `iam:reset` must be able to destroy it without touching
  # AxeBOM's own database.
  COMPOSE_IAM: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.iam.yml
  # Same as COMPOSE_IAM — a second name because `dev` reaches for "infra plus
  # IAM, nothing else yet" specifically to wait out ZITADEL's health chain
  # before the app tier (which needs ZITADEL_PROJECT_ID) is ever created.
  COMPOSE_INFRA_IAM: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.iam.yml
  COMPOSE_HEAVY: docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.iam.yml -f deploy/compose/docker-compose.app.yml -f deploy/compose/docker-compose.heavy.yml
  # Python lives in a venv on Windows (Scripts/) and Linux (bin/).
  PY: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'

tasks:

  default:
    desc: List available tasks
    cmds: [task --list]
    silent: true

  # ================================================================ preflight
  preflight:
    desc: Report toolchain status and known environment gaps
    cmds:
      - go run ./cmd/axebom preflight

  # ================================================================== the gate
  verify:
    desc: "The gate: fmt + lint + boundaries + test + build + docs. CI runs this."
    # SEQUENTIAL, not parallel `deps`.
    #
    # Two reasons, both learned the hard way:
    #   - golangci-lint refuses to run concurrently with itself, so `lint` and
    #     `lint:boundaries` as parallel deps fail with "parallel golangci-lint
    #     is running". (lint:boundaries is omitted anyway — `lint` already runs
    #     depguard; it stays a standalone target for a fast boundary check.)
    #   - golangci-lint + go test + go build + vite in parallel, on a machine
    #     also running the Docker stack, exhausts memory and the build dies
    #     with "fatal error: out of memory". A gate that passes or fails
    #     depending on how much RAM happens to be free is not a gate.
    #
    # Ordered cheapest-first so an obvious failure surfaces quickly.
    cmds:
      - task: fmt:check
      - task: profile:lint
      - task: profile:guardrails
      - task: profile:evidence:check
      - task: docs:lint
      - task: lint
      - task: test
      - task: build

  fmt:
    desc: Format Go, Python and TypeScript
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 fmt ./...
      - cmd: '{{.PY}} -m ruff format libs/py-shared workers'
        ignore_error: true
      - cmd: npm --prefix frontend run format
        ignore_error: true

  fmt:check:
    desc: Fail if anything is unformatted
    cmds:
      - cmd: gofmt -l cmd libs services tools
        silent: true
      - cmd: '{{.PY}} -m ruff format --check libs/py-shared workers'
        ignore_error: true

  lint:
    desc: Static analysis across Go, Python and TypeScript
    cmds:
      # `go install` puts binaries in GOPATH/bin, which is on PATH in some
      # shells and not others — PowerShell picks up the user PATH, a fresh Git
      # Bash may not. Resolving it at run time means `task verify` behaves the
      # same everywhere instead of failing with "executable file not found" in
      # one terminal and passing in another.
      #
      # Forward slashes deliberately: task's embedded shell accepts them on
      # Windows, and backslashes from `go env GOPATH` would be eaten as escapes.
      - '"$(go env GOPATH)/bin/golangci-lint" run ./...'
      # ⚠ THESE TWO USED TO CARRY `ignore_error: true`, SO THE GATE ENFORCED GO
      # LINT AND NOTHING ELSE.
      #
      # A Python or TypeScript lint failure ran, printed, and passed. It was
      # found the ordinary way: a new Playwright spec had sixteen eslint errors
      # and `task verify` reported exit 0 twice in a row. Nothing recorded why
      # the allowance existed, and both trees are clean today — so the gate now
      # means what its name says.
      - '{{.PY}} -m ruff check libs/py-shared workers'
      - npm --prefix frontend run lint

  lint:boundaries:
    desc: Fail if any service imports another service's internals
    # THE mechanical guard (ADR-0001 mitigation 3). A cross-service import
    # compiles cleanly under `go build`; only this rejects it. Verified once by
    # deliberately introducing a violation — see docs/STATE.md.
    # Disabling it is an ADR-level decision, not a convenience.
    cmds:
      - golangci-lint run --enable-only depguard ./...

  # ==================================================================== tests
  test:
    desc: Unit and contract tests
    # The race detector requires cgo, which requires a C toolchain. Windows
    # dev machines rarely have one, so `-race` runs where it can and CI's
    # ubuntu job always runs it. Silently dropping it everywhere would mean
    # nobody ever runs it; failing on Windows would block local development.
    cmds:
      - task: test:go
      - cmd: '{{.PY}} -m pytest libs/py-shared workers -q'
        ignore_error: true

  test:go:
    internal: true
    cmds:
      - cmd: |
          {{if eq OS "windows"}}
          go test ./... -count=1
          {{else}}
          go test ./... -race -count=1
          {{end}}

  test:race:
    desc: Force the race detector (needs cgo + a C toolchain)
    cmds:
      - go test ./... -race -count=1

  test:golden:
    desc: Normalizer golden-file diff over the fixture corpus
    # ⚠ Runs NO scanners and touches no network. It replays the committed
    # fixtures/*/raw/*.json, which is what makes normalization tests
    # deterministic, offline and stable across upstream tool changes (ADR-0003).
    #
    # A failure here means the canonical output changed. That is the point:
    # none of these changes crash anything, they just report a different number.
    # Update a golden only with `normalize_runner --write-expected` AND a
    # justification in the commit message.
    cmds:
      # ⚠ BOTH CORPORA. The SBOM goldens replay committed scanner JSON; the HBOM
      # golden replays a committed parts list, because no engine produces
      # hardware output — the customer's CSV IS the raw artifact. Same property
      # either way: same input in, byte-identical canonical model out.
      - '{{.PY}} -m pytest workers/sbom/test_golden.py workers/hbom/test_golden.py -v -m golden'

  test:conformance:
    desc: Validate exported SPDX/CycloneDX documents against the OFFICIAL schemas
    # ⚠ NOT PART OF `task verify`. This validates the exporter's OUTPUT against
    # real third-party tools (cyclonedx-python-lib, spdx-tools) rather than our
    # own serializer's opinion of itself — install the extra first:
    #   pip install -e ".[conformance]"
    # The SPDX case is a KNOWN, currently-failing check (xfail, not skipped) —
    # see tools/conformance/test_spdx_cyclonedx.py's own doc comment and
    # docs/STATE.md for the root cause found and not yet fixed.
    cmds:
      - '{{.PY}} -m pytest tools/conformance -v'

  normalize:
    desc: Normalize one fixture's stored artifacts and print the summary
    cmds:
      - '{{.PY}} -m workers.sbom.normalize_runner {{.CLI_ARGS}}'

  test:rls:
    desc: Assert every tenant-scoped table has RLS, and cross-tenant access fails
    # The acceptance criterion of Phase 1. Requires `task dev`; the tests skip
    # (not fail) without a database so a developer offline is not blocked.
    cmds:
      - go test ./libs/go-shared/platform/db -run "TestRLSCoverage|TestCrossTenant|TestPoolReuse|TestQueryOutside|TestAppRole|TestAuditLog|TestRawArtifacts|TestSetting|TestWithTenant" -v -count=1

  db:verify-rls:
    desc: Operator-facing RLS coverage report for a live database
    cmds:
      - go run ./cmd/axebom db verify-rls

  # ==================================================================== build
  build:
    desc: Build every Go service and the frontend
    cmds:
      - go build ./...
      - cmd: npm --prefix frontend run build
        ignore_error: true

  gen:services:
    desc: Regenerate all service scaffolds (hand-edited files are preserved)
    cmds:
      - go run ./tools/gen-service --all

  # ===================================================================== docs
  profile:guardrails:
    desc: "Fail on a hardcoded field count or an assertion of compliance"
    # ⚠ THE TWO CHECKS PHASE 16 ASKS TO BE GREPPED BY HAND. A hand-grep happens
    # once, performed by the person who already knows the rule — who is the
    # person least likely to have broken it. Both guard failures that are
    # invisible in normal operation: nothing crashes, no test goes red, and the
    # wrong thing appears on a document somebody hands to a regulator.
    cmds:
      - go run ./cmd/axebom profile guardrails

  profile:evidence:
    desc: Regenerate docs/COMPLIANCE-REPORT.md from the profile
    cmds:
      - go run ./cmd/axebom profile evidence

  profile:evidence:check:
    desc: "Fail if the committed evidence pack no longer describes the product"
    # A STALE PACK IS WORSE THAN AN ABSENT ONE: it is a document somebody hands
    # to an auditor in good faith, describing a product that has moved.
    cmds:
      - go run ./cmd/axebom profile evidence -check

  docs:lint:
    desc: Fail on broken cross-references between specification documents
    # Every phase file opens with a "Read first" list. A session that cannot
    # resolve one of those paths starts without a contract it was told to obey.
    cmds:
      - go run ./cmd/axebom docs lint docs/

  # ================================================================= local dev
  dev:
    desc: Bring up the whole system — infra + 8 services + workers + frontend
    # STAGED, not one `up -d --build`. Three real bugs lived in the single-shot
    # version, all traced back to the same root cause — nothing waited for
    # anything to be truly READY, only STARTED:
    #   1. App services raced NATS/Redis/Vault/the MinIO bucket instead of
    #      waiting for them (fixed properly in docker-compose.app.yml's
    #      depends_on now, but ZITADEL's own ~2-minute init->setup->api->login
    #      chain has no such dependency to lean on from outside its own file).
    #   2. ZITADEL_PROJECT_ID/ZITADEL_SPA_CLIENT_ID start empty, so 6 of 8 app
    #      services refuse to start; they only ever got created once someone
    #      ran `iam:bootstrap` BY HAND and re-ran `up -d` — see docs/STATE.md's
    #      2026-08-24 (g) entry, which also found bootstrap's own linking step
    #      needs migrations AND seed rows to already exist, i.e. the correct
    #      order is migrate -> seed -> bootstrap, not bootstrap first.
    #   3. `task dev` returned as soon as containers were CREATED, not once
    #      /readyz agreed — so "done" and "actually usable" were different
    #      moments and nothing told you which one you were looking at.
    deps: [preflight]
    cmds:
      # Stage 1: infra + identity, and WAIT for real health — this is what
      # actually waits out ZITADEL's slow chain instead of racing it.
      #
      # ⚠ NAMED SERVICES, NOT THE WHOLE FILE SET. `--wait` fails outright if
      # ANY container in scope exits — including a one-shot job that is
      # SUPPOSED to (restart: "no"), unless something in the SAME invocation
      # depends on it via service_completed_successfully. minio-init exits 0
      # by design, but its only consumers (project/report/fetcher) live in
      # docker-compose.app.yml, not loaded yet at this stage — so naming it
      # here makes `--wait` treat its correct exit as a failure. Deferring it
      # to stage 3, where its real dependents are, is what already makes
      # ordinary depends_on (no --wait needed) resolve it correctly — the
      # same mechanism `migrate` has always relied on.
      - '{{.COMPOSE_INFRA_IAM}} up -d --build --wait postgres nats redis minio vault mailpit zitadel-api zitadel-login'
      # Stage 2: migrate, seed, then bootstrap identity — in that order, and
      # BEFORE the app tier exists, so ZITADEL_PROJECT_ID lands in .env before
      # any service that needs it is ever created. All three are safe to run
      # every time: migrations apply only what's pending, seed rows use
      # ON CONFLICT DO NOTHING/UPDATE, and bootstrap is find-or-create.
      - go run ./cmd/axebom db migrate
      - go run ./cmd/axebom db seed
      - go run ./cmd/axebom iam bootstrap --write-env
      # ⚠ `cmd: task dev:build`, DELIBERATELY NOT INLINED, AND NOT CALLED VIA
      # Task's OWN `task:` DEPENDENCY SYNTAX EITHER.
      #
      # `dotenv:` (top of this file) loads .env into THIS PROCESS's environment
      # exactly ONCE, when `task dev` itself starts — before the bootstrap step
      # above has written anything. `docker compose`, when a variable exists in
      # BOTH the shell environment and its own auto-read .env file, uses the
      # SHELL value — so a compose build step run via `task:` (which stays in
      # this same process, inheriting its now-stale exported
      # ZITADEL_PROJECT_ID/ZITADEL_SPA_CLIENT_ID/ZITADEL_ISSUER) would bake the
      # ids from BEFORE this run's bootstrap into the frontend image, not the
      # fresh ones it just wrote to the FILE. Confirmed live: the deployed
      # frontend authenticated against a project one whole bootstrap cycle out
      # of date, reproducing on every run, not just after a fresh `iam:reset`.
      #
      # `cmd: task dev:build` spawns a genuinely NEW `task` process, which
      # re-reads .env from disk at ITS OWN startup — this is what actually
      # gets the just-written ids into the build.
      - cmd: task dev:build

  dev:build:
    desc: "Internal: the second half of `task dev`, run as its own process — see dev's own comment"
    # NOT `internal: true` — that blocks exactly the `cmd: task dev:build`
    # subprocess invocation `dev` depends on (go-task refuses to run an
    # internal task except via its own `task:` dependency syntax, confirmed
    # live: "Task dev:build is internal"). Normally run through `task dev`,
    # not directly — see the ⚠ comment on `dev` above for why this is a
    # separate task instead of being inlined there.
    cmds:
      # Stage 3: the full stack. App services are created fresh here, after
      # .env is correct, so there is no second `up -d` needed to pick up the
      # ids bootstrap just wrote.
      - '{{.COMPOSE}} up -d --build'
      - '{{.COMPOSE}} ps'
      # Stage 4: block until every service reports /readyz `up`, not just
      # "container started" — this is the actual fix for "taking forever":
      # `task dev` now only reports success once the stack really is one.
      - '{{.COMPOSE}} run --rm --no-deps -T migrate health --in-cluster --wait 90s'
      # Only reached on success — records this build as the rollback target.
      - go run ./cmd/axebom dev snapshot
      - cmd: echo ""
        silent: true
      # ⚠ $ZITADEL_PUBLIC_URL, NOT A HARDCODED URL. These two lines used to
      # read http://localhost:5173, which is wrong on BOTH counts the moment
      # the deployment is not plain-HTTP-localhost — and this file is the
      # first place anyone looks for the address. The wrong scheme dead-ends
      # at nginx's "400 The plain HTTP request was sent to HTTPS port"; the
      # wrong host serves the app and then fails at login, because the SPA
      # sends window.location.origin as its redirect_uri and ZITADEL matches
      # the registered value exactly. nginx now redirects both cases to the
      # canonical origin (deploy/docker/nginx.conf), but printing the real
      # one means nobody has to be redirected in the first place.
      - cmd: echo "  frontend  ${ZITADEL_PUBLIC_URL:-http://localhost:5173}"
        silent: true
      - cmd: echo "  api       http://localhost:8080"
        silent: true
      - cmd: echo "  identity  ${ZITADEL_PUBLIC_URL:-http://localhost:5173}/ui/console"
        silent: true
      - cmd: echo "  minio     http://localhost:59001   (minioadmin/minioadmin)"
        silent: true
      - cmd: echo "  mailpit   http://localhost:58025"
        silent: true
      - cmd: echo ""
        silent: true
      # The inline '#' below is not a bug to remove and re-add: a literal '#'
      # inside a double-quoted echo argument is mis-parsed by go-task's shell
      # tokenizer as a comment start, truncating the string and failing with
      # 'reached EOF without closing quote' — even though every container is
      # already up by this point in the task. Keep the explanation on its own
      # comment line instead of inside the quotes.
      - cmd: echo "  task health   (per-service readiness)"
        silent: true

  dev:rollback:
    desc: Revert the local stack to the last build that passed `task dev`'s health check
    # No registry, CI or production deploy pipeline exists yet (see
    # docs/LIMITATIONS.md) — this is a purely local safety net for when a
    # rebuild breaks the dev stack: retag last-known-good images back to
    # `:dev` and recreate containers from them WITHOUT rebuilding.
    cmds:
      - go run ./cmd/axebom dev rollback
      - '{{.COMPOSE}} up -d --no-build'
      - '{{.COMPOSE}} run --rm --no-deps -T migrate health --in-cluster --wait 90s'

  dev:infra:
    desc: Bring up ONLY the backing stores (run services from your IDE)
    deps: [preflight]
    cmds:
      - '{{.COMPOSE_INFRA}} up -d'
      - '{{.COMPOSE_INFRA}} ps'

  health:
    desc: Report readiness of every running service
    # Runs INSIDE the compose network. Only the gateway is published to the
    # host, so probing from outside would report the other seven as unreachable
    # even when they are perfectly healthy.
    cmds:
      - '{{.COMPOSE}} run --rm --no-deps -T migrate health --in-cluster {{.CLI_ARGS}}'

  dev:heavy:
    desc: Core stack plus Dependency-Track and SonarQube (needs ~12GB free RAM)
    cmds:
      - '{{.COMPOSE_HEAVY}} up -d'

  dev:down:
    desc: Stop the stack, keep volumes
    cmds: ['{{.COMPOSE}} down']

  dev:nuke:
    desc: Stop the stack and DELETE all volumes
    prompt: >-
      This deletes every local volume, including depcheck-data. Losing that
      means paying the 30-60 minute NVD sync again. Continue?
    cmds: ['{{.COMPOSE}} down -v']

  logs:
    desc: "Tail logs. Usage: task logs -- gateway"
    cmds: ['{{.COMPOSE}} logs -f {{.CLI_ARGS}}']

  # ==================================================================== TLS
  tls:gen:
    desc: Generate a self-signed cert for ZITADEL_DOMAIN (needed when that's a LAN IP, not localhost)
    # ⚠ WHY THIS EXISTS AT ALL. Browsers only expose crypto.subtle — which the
    # OIDC login flow needs for PKCE — in a SECURE CONTEXT: https://, or the
    # single special-cased exception, http://localhost. Reaching this stack
    # at its LAN IP over plain http fails sign-in with "Crypto.subtle is
    # available only in secure contexts", not because of anything wrong with
    # ZITADEL or the app — the browser refuses to expose the API at all.
    # A self-signed cert the browser is told to trust once is what makes
    # https:// (and therefore a real secure context) available at an IP that
    # will never get a publicly-trusted certificate.
    cmds:
      - cmd: mkdir -p deploy/compose/.data/tls
        platforms: [linux, darwin]
      - cmd: powershell -Command "New-Item -ItemType Directory -Force -Path deploy/compose/.data/tls | Out-Null"
        platforms: [windows]
      # Docker may already have auto-created this directory as ROOT — e.g. by
      # bind-mounting it into a container (docker-compose.app.yml's frontend
      # service does) before this task ever ran. The exact same trap as
      # zitadel-bootstrap/, see iam:reset's own comment; reclaimed the same way.
      - cmd: >-
          docker run --rm -v {{.ROOT_DIR}}/deploy/compose/.data:/d alpine:3
          sh -c "chown -R $(id -u):${HOST_GID:-1000} /d/tls"
        platforms: [linux, darwin]
      - >-
        openssl req -x509 -newkey rsa:2048 -nodes -days 825
        -keyout deploy/compose/.data/tls/frontend.key
        -out deploy/compose/.data/tls/frontend.crt
        -subj "/CN=${ZITADEL_DOMAIN:-localhost}"
        -addext "subjectAltName=IP:${ZITADEL_DOMAIN:-127.0.0.1}"
      # openssl writes the key 0600 (host user only) by default. nginx reads
      # it as the base image's own `nginx` uid inside the container, not the
      # host user, so a bind-mounted 0600 key fails "Permission denied" the
      # instant nginx tries to load it — confirmed live. Relaxed on purpose:
      # this key protects nothing but crypto.subtle's secure-context check for
      # a local dev stack, not a real secret worth the stricter host ACL.
      - cmd: chmod 644 deploy/compose/.data/tls/frontend.key
        platforms: [linux, darwin]
      - cmd: echo ""
        silent: true
      - cmd: 'echo "  wrote deploy/compose/.data/tls/frontend.{crt,key} for ZITADEL_DOMAIN=${ZITADEL_DOMAIN:-localhost}"'
        silent: true
      - cmd: 'echo "  next -> task iam:reset (ZITADEL_EXTERNALSECURE changes at setup time, same as ZITADEL_DOMAIN), then task dev"'
        silent: true

  # ================================================================ identity
  # ZITADEL runs as a pinned, UNMODIFIED container and is reached over OIDC.
  # No ZITADEL server code is linked into an AxeBOM binary — it is AGPL-3.0
  # and CLAUDE.md invariant 9 keeps copyleft in a separate service.

  iam:up:
    desc: Start ZITADEL (init -> setup -> api -> login)
    cmds:
      - '{{.COMPOSE_IAM}} up -d zitadel-api zitadel-login'
      - '{{.COMPOSE_IAM}} ps zitadel-api zitadel-login'
      - cmd: echo ""
        silent: true
      - cmd: echo "  console   http://localhost:5173/ui/console"
        silent: true
      - cmd: echo "  issuer    http://localhost:5173"
        silent: true
      - cmd: echo "  direct    http://localhost:58080   (bypasses nginx)"
        silent: true
      - cmd: echo ""
        silent: true
      - cmd: 'echo "  next -> task iam:bootstrap"'
        silent: true

  iam:bootstrap:
    desc: Create the ZITADEL project, roles, applications and development orgs
    cmds:
      - go run ./cmd/axebom iam bootstrap {{.CLI_ARGS}}

  iam:verify:
    desc: Print the issuer, project, roles and org-to-tenant mapping
    cmds:
      - go run ./cmd/axebom iam verify {{.CLI_ARGS}}

  iam:logs:
    desc: "Tail identity logs. Usage: task iam:logs -- zitadel-setup"
    cmds: ['{{.COMPOSE_IAM}} logs -f {{.CLI_ARGS | default "zitadel-api zitadel-login"}}']

  iam:reset:
    desc: DESTROY the identity tier — ZITADEL's database and its bootstrap keys
    prompt: >-
      This drops ZITADEL's database and deletes the bootstrap volume holding
      the machine key. Every user, org and application in ZITADEL is lost, and
      `task iam:bootstrap` must be run again. AxeBOM's own database is not
      touched. Continue?
    cmds:
      # The volume and the database go together. A surviving machine key against
      # a fresh instance authenticates as a user that no longer exists, which
      # reports as an opaque 401 rather than as the state mismatch it is.
      - '{{.COMPOSE_IAM}} rm -sf zitadel-api zitadel-login zitadel-setup zitadel-init'
      # Written by a container running as root, so removal needs the same.
      - >-
        docker run --rm -v {{.ROOT_DIR}}/deploy/compose/.data:/d alpine:3
        sh -c "rm -rf /d/zitadel-bootstrap"

      - >-
        {{.COMPOSE_INFRA}} exec -T postgres
        psql -U ${POSTGRES_USER:-axebom} -d ${POSTGRES_DB:-axebom}
        -c "DROP DATABASE IF EXISTS ${ZITADEL_POSTGRES_DB:-zitadel} WITH (FORCE);"
      # Every existing zitadel_org_id/zitadel_user_id in AxeBOM's own database
      # is now provably stale — the ZITADEL org/user it pointed at no longer
      # exists. linkIdentities (libs/go-shared/iam/provision.go) only
      # overwrites a NULL or already-matching value, as a safety guard against
      # silently reassigning a tenant in the ordinary case — which is exactly
      # wrong immediately after this reset. Clearing them here is what lets a
      # subsequent `iam bootstrap` relink cleanly instead of logging
      # "no seeded tenant to link" for orgs it should have relinked.
      - >-
        {{.COMPOSE_INFRA}} exec -T postgres
        psql -U ${POSTGRES_USER:-axebom} -d ${POSTGRES_DB:-axebom}
        -c "UPDATE auth.tenants SET zitadel_org_id = NULL WHERE zitadel_org_id IS NOT NULL;
            UPDATE auth.users SET zitadel_user_id = NULL WHERE zitadel_user_id IS NOT NULL;"
      - task: iam:up
      # zitadel-setup recreates deploy/compose/.data/zitadel-bootstrap/ as
      # whatever user it runs as inside its container — root, in practice —
      # so the HOST-run `axebom iam bootstrap` (task iam:bootstrap, or the
      # bootstrap step inside `task dev`) then cannot create service-keys/
      # under it: "permission denied". Reclaiming ownership through a
      # root-running container mirrors the rm -rf step above for the same
      # reason — the host user cannot chown files it does not own either.
      - >-
        docker run --rm -v {{.ROOT_DIR}}/deploy/compose/.data:/d alpine:3
        sh -c "chown -R $(id -u):${HOST_GID:-1000} /d/zitadel-bootstrap"

  # ================================================================ database
  db:migrate:
    desc: Apply pending migrations across every schema
    cmds:
      - go run ./cmd/axebom db migrate

  db:status:
    desc: Show applied and pending migrations per schema
    cmds:
      - go run ./cmd/axebom db status

  db:seed:
    desc: Load development fixtures (TWO tenants — isolation bugs are invisible with one)
    cmds:
      - go run ./cmd/axebom db seed

  db:reset:
    desc: Drop every schema, migrate from scratch, seed
    prompt: This destroys the local database. Continue?
    cmds:
      - go run ./cmd/axebom db reset
      - go run ./cmd/axebom db seed

  db:down-all:
    desc: Roll every schema back to zero (development only)
    prompt: This drops every table. Continue?
    cmds:
      - go run ./cmd/axebom db down-all

  profile:lint:
    desc: Validate the compliance and operational profiles — counts, ids, statuses, paths
    # The counts are TRANSCRIPTION ASSERTIONS against the source PDF. A
    # mismatch means the guideline was revised or the transcription is wrong;
    # both need a human. Never "fix" the expected value to match.
    cmds:
      - go run ./cmd/axebom profile lint
      # ⚠ THE OPERATIONAL PROFILE IS LINTED TOO, BY THE SAME CHECKER.
      # A second field set that nothing validates is a second field set that
      # drifts. Its `kind: operational` is what stops the checker holding it to
      # compliance rules it has no authority behind — and, conversely, what
      # makes the checker refuse it if it ever grows a CERT-In section.
      - go run ./cmd/axebom profile lint docs/reference/hbom-manufacturing-v1.yaml
      - go run ./cmd/axebom profile lint docs/reference/aibom-operational-v1.yaml

  profile:gen:
    desc: Regenerate Go and Python models from the compliance profile
    # ruff format runs after generation so the committed Python is stable and
    # the drift check compares like with like.
    cmds:
      - go run ./cmd/axebom profile gen
      # ⚠ EACH OPERATIONAL PROFILE IS GENERATED TOO, AND SEPARATELY. A field set
      # that is authored, linted and scored but has no generated Go consumer is
      # invisible in every screen and every report that reads `model.*Fields` —
      # exactly the failure the CERT-In generator exists to prevent, and exactly
      # what happened to hbom_manufacturing before it was generated.
      - go run ./cmd/axebom profile gen --profile docs/reference/hbom-manufacturing-v1.yaml
      - go run ./cmd/axebom profile gen --profile docs/reference/aibom-operational-v1.yaml
      - cmd: '{{.PY}} -m ruff format libs/py-shared/axebom_shared/model'
        ignore_error: true

  profile:show:
    desc: "Show what the profile requires. Usage: task profile:show -- --bom-type AIBOM"
    cmds:
      - go run ./cmd/axebom profile show {{.CLI_ARGS}}

  # ================================================================== OSINT
  osint:list:
    desc: List every pinned engine, its version and how it resolves
    cmds:
      - go run ./cmd/axebom toolctl list

  osint:dryrun:
    desc: Resolve every pinned URL without downloading — proves the manifest is real
    # Container is preferred for most engines, so `--force-mode binary` is what
    # actually exercises the URL TEMPLATES. Both run: one checks what will be
    # used, the other checks what is declared.
    cmds:
      - go run ./cmd/axebom toolctl dryrun
      - go run ./cmd/axebom toolctl dryrun --force-mode binary

  osint:build-ai-bom:
    desc: Build the local ai-bom engine image (upstream ships a pip package, not a container)
    # ai-bom (Trusera) publishes no container image of its own — see
    # OSINT/tools.manifest.yaml's `ai-bom` entry and
    # deploy/docker/engines/Dockerfile.ai-bom for why one has to be built
    # locally: AIBomAdapter runs it in the scan sandbox over untrusted
    # customer code (CLAUDE.md invariant 7), and the sandbox only knows how to
    # invoke a container. `toolctl pull` (below) cannot fetch this image from
    # any registry — it does not exist on one — so this step has to run first,
    # and `osint:pull` depends on it for exactly that reason.
    cmds:
      - docker build -f deploy/docker/engines/Dockerfile.ai-bom -t axebom/ai-bom-engine:dev .

  osint:build-airom:
    desc: Build the local airom engine image (upstream ships a PyPI wheel, not a container)
    # Same shape as osint:build-ai-bom above, and the same reason: airom
    # (airomhq/airom) publishes a Go static binary as a platform wheel on PyPI
    # and no container image, while AiromAdapter runs it in the scan sandbox
    # over untrusted customer code — which the sandbox can only do to a
    # container. `toolctl pull` cannot fetch this image from any registry
    # because it exists on none, so this runs first and `osint:pull` depends
    # on it.
    #
    # There is no `osint:build-cdxgen-ai`: `cdxgen-ai` is the SAME
    # digest-pinned upstream image as `cdxgen`, invoked with `-t ai` — the
    # `syft-spdx` precedent. `toolctl pull` fetches it once.
    cmds:
      - docker build -f deploy/docker/engines/Dockerfile.airom -t axebom/airom-engine:dev .

  osint:pull:
    desc: Pre-pull every container-mode engine image (REQUIRED before scanning)
    # Engines run with --network=none, so a container cannot fetch its own
    # image. Without this every container engine reports "No such image" as an
    # honest but entirely avoidable gap.
    deps: [osint:build-ai-bom, osint:build-airom]
    cmds:
      - go run ./cmd/axebom toolctl pull {{.CLI_ARGS}}

  osint:sync:
    desc: Download and verify pinned scanner binaries
    cmds:
      - go run ./cmd/axebom toolctl sync

  osint:verify:
    desc: Probe every engine and report available/unavailable with reasons
    cmds:
      - go run ./cmd/axebom toolctl verify

  osint:dbsync:
    desc: Provision the vulnerability databases (grype, trivy, osv) — REQUIRED before any vuln scan
    # ⚠ Without this, every DB-backed engine reports `unavailable` and NO
    # vulnerability matching happens at all. That is deliberate (ADR-0009): an
    # engine with no database does not fail, it reports a clean project, so the
    # run is refused rather than allowed to produce a false all-clear.
    #
    # Downloads several GB and takes a few minutes. It is the one operation that
    # runs an engine image with a network — no user code is mounted.
    cmds:
      - python -m workers.sbom.dbsync --all

  osint:dbstatus:
    desc: Show which vulnerability databases are provisioned, and how old they are
    cmds:
      - python -m workers.sbom.dbstatus

  osint:licenses:
    desc: Fail if a copyleft dependency would be linked into an AxeBOM binary
    # CLAUDE.md invariant 9. django-bom is GPL-3.0 and would have relicensed
    # hbom-worker; this is the mechanical guard against that class of mistake.
    cmds:
      - go run ./cmd/axebom toolctl licenses

  proto:gen:
    desc: "[phase 6] Generate Go and Python code from proto/"
    cmds:
      - cmd: buf generate
        dir: proto

  # ==================================================================== phases
  phase:
    desc: "Print a phase brief. Usage: task phase -- 03"
    cmds:
      - cmd: cat docs/phases/PHASE-{{.CLI_ARGS}}-*.md
        ignore_error: true
    silent: true
