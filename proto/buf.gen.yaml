# Codegen for Go and Python.
#
# Both are generated from the same .proto files so a contract change cannot
# drift between the Go control plane and the Python workers — which is exactly
# the failure ADR-0001's boundary lint exists to prevent at the import level,
# applied here at the wire level.
#
# Run: task proto:gen   (Phase 6, once there are messages to generate)

version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/encorebom/encorebom/proto/gen/go

plugins:
  # --- Go ---
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative

  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true

  # --- Python ---
  - remote: buf.build/protocolbuffers/python
    out: gen/python

  - remote: buf.build/protocolbuffers/pyi
    out: gen/python
