# ============================================================================
# EncoreBOM — OSINT tool manifest
# ============================================================================
# The single machine-readable source of truth for every scanner EncoreBOM
# invokes. Read by `encorebom toolctl sync|verify` (a Go subcommand — no bash).
#
# Rationale: docs/ADR/0002-pinned-artifacts-no-source-builds.md
# Usage + failure modes: docs/04-OSINT-INTEGRATION.md
#
# ---------------------------------------------------------------------------
# ⚠ VERSIONS AND DIGESTS BELOW ARE UNVERIFIED PLACEHOLDERS
# ---------------------------------------------------------------------------
# They were written from upstream research and have NEVER been resolved against
# the network. Phase 2's first task is:
#
#     task osint:dryrun      # resolve every URL + digest, expect zero 404s
#
# then pin the real values. `sha256: TBD` and `digest: TBD` make `toolctl sync`
# refuse to install rather than fetch something unverified. Do not remove a TBD
# to "make it work" — fill it in from the upstream checksum file.
#
# ---------------------------------------------------------------------------
# RULES
# ---------------------------------------------------------------------------
# 1. Images are pinned BY DIGEST, never by tag. A tag is mutable.
# 2. Binaries are verified against the upstream SHA256 checksum file, and by
#    cosign where upstream publishes signatures.
# 3. Trivy's distribution channel was compromised TWICE in March 2026.
#    Verification is not optional. If `cosign` is absent, verification degrades
#    to checksum-only WITH A LOUD WARNING — never silently.
# 4. Java tools are container-only. The primary dev machine has Java 1.8;
#    Dependency-Check needs 11+, cbomkit needs 17+. Do not add a local path.
# 5. `mode_preference: [container, binary]` — container first, local binary as
#    fallback, then the engine marks itself `unavailable`. A missing engine
#    NEVER fails a whole scan; it is recorded in Engine Coverage.
# ============================================================================

manifest:
  version: 1
  updated: "2026-08-16"
  verified_against_network: false      # flipped true by Phase 2
  tools_dir: .encorebom/tools

defaults:
  mode_preference: [container, binary]
  verify:
    checksum: required
    signature: preferred               # `required` once cosign is installed

# ============================================================================
# SBOM
# ============================================================================
tools:

  - id: syft
    role: generator
    families: [sbom]
    upstream: https://github.com/anchore/syft
    license: Apache-2.0
    version: "1.19.1"
    container:
      image: docker.io/anchore/syft
      digest: TBD
    binary:
      url_template: https://github.com/anchore/syft/releases/download/v{version}/syft_{version}_{os}_{arch}.tar.gz
      checksum_file: https://github.com/anchore/syft/releases/download/v{version}/syft_{version}_checksums.txt
      cosign: true
      sha256: { linux_amd64: TBD, windows_amd64: TBD, darwin_arm64: TBD }
    source_kinds: [git, upload, image]
    produces: [components, licenses]
    native_format: cyclonedx-json-1.6
    also_emits: [spdx-json-2.3]
    default_weight: 5
    db_backed: false
    notes: >
      PRIMARY SBOM generator. Emits CycloneDX and SPDX natively — parse the
      standard document, never screen-scrape. Version metadata is injected via
      goreleaser ldflags, which is why a source build reports `unknown`.

  - id: grype
    role: vulnerability
    families: [sbom]
    upstream: https://github.com/anchore/grype
    license: Apache-2.0
    version: "0.87.0"
    container: { image: docker.io/anchore/grype, digest: TBD }
    binary:
      url_template: https://github.com/anchore/grype/releases/download/v{version}/grype_{version}_{os}_{arch}.tar.gz
      checksum_file: https://github.com/anchore/grype/releases/download/v{version}/grype_{version}_checksums.txt
      cosign: true
      sha256: { linux_amd64: TBD, windows_amd64: TBD, darwin_arm64: TBD }
    source_kinds: [sbom]
    produces: [vulnerabilities]
    emits_id_namespaces: [GHSA, CVE, OSV]
    default_weight: 4
    db_backed: true
    db_refresh: daily
    notes: >
      Runs against OUR syft SBOM, not the directory. Re-scanning would produce
      a second, subtly different inventory to reconcile.
      A grype-db schema bump can break a pinned binary outright -> ENGINE_DB_STALE
      and mark unavailable rather than emit stale matches.

  - id: trivy-fs
    role: hybrid
    families: [sbom]
    upstream: https://github.com/aquasecurity/trivy
    license: Apache-2.0
    version: "0.58.2"
    container: { image: ghcr.io/aquasecurity/trivy, digest: TBD }
    binary:
      url_template: https://github.com/aquasecurity/trivy/releases/download/v{version}/trivy_{version}_{OS}-{ARCH}.tar.gz
      checksum_file: https://github.com/aquasecurity/trivy/releases/download/v{version}/trivy_{version}_checksums.txt
      cosign: true
      sha256: { linux_amd64: TBD, windows_amd64: TBD, darwin_arm64: TBD }
    mode: fs
    source_kinds: [git, upload]
    produces: [components, vulnerabilities, licenses, secrets]
    native_format: cyclonedx-json-1.6
    emits_id_namespaces: [CVE, GHSA]
    default_weight: 4
    db_backed: true
    security_note: >
      ⚠ Trivy's distribution channel was compromised twice in a coordinated
      attack in March 2026. Checksum AND cosign verification are mandatory;
      pin the image by digest, never by tag.

  - id: trivy-image
    role: hybrid
    families: [sbom]
    upstream: https://github.com/aquasecurity/trivy
    license: Apache-2.0
    version: "0.58.2"
    container: { image: ghcr.io/aquasecurity/trivy, digest: TBD }
    mode: image
    source_kinds: [image]
    produces: [components, vulnerabilities, licenses]
    native_format: cyclonedx-json-1.6
    default_weight: 4
    db_backed: true
    notes: >
      Deliberately a SEPARATE engine from trivy-fs. Different invocation,
      different capabilities, different parser. The unit is (tool, mode).

  - id: osv-scanner
    role: vulnerability
    families: [sbom]
    upstream: https://github.com/google/osv-scanner
    license: Apache-2.0
    version: "2.0.2"
    container: { image: ghcr.io/google/osv-scanner, digest: TBD }
    binary:
      url_template: https://github.com/google/osv-scanner/releases/download/v{version}/osv-scanner_{os}_{arch}
      checksum_file: https://github.com/google/osv-scanner/releases/download/v{version}/checksums.txt
      cosign: false
      sha256: { linux_amd64: TBD, windows_amd64: TBD, darwin_arm64: TBD }
    source_kinds: [git, upload, sbom]
    produces: [vulnerabilities]
    emits_id_namespaces: [OSV, GO, PYSEC, RUSTSEC, MAL, GHSA, CVE]
    default_weight: 3
    db_backed: true
    notes: >
      The richest source of ALIAS EDGES — its `aliases` field is authoritative
      input to the union-find in 03-NORMALIZER-SPEC.md §2.
      CLI has had breaking changes across majors; pin exactly and rely on the
      nightly contract test to catch drift.

  - id: dependency-check
    role: vulnerability
    families: [sbom]
    upstream: https://github.com/dependency-check/DependencyCheck
    license: Apache-2.0
    version: "11.1.1"
    container: { image: docker.io/owasp/dependency-check, digest: TBD }
    binary: null                         # container-only: needs Java 11+
    container_only: true
    container_only_reason: "Java 11+ required; primary dev machine has Java 1.8"
    source_kinds: [git, upload]
    produces: [components, vulnerabilities]
    identity_kind: cpe
    emits_id_namespaces: [CVE]
    default_weight: 2
    db_backed: true
    requires_env: [NVD_API_KEY]
    requires_volume: depcheck-data
    first_run_minutes: [30, 60]
    notes: >
      Emits CPEs with a confidence field. A LOW-confidence CPE attaches as a
      CANDIDATE IDENTITY and must NEVER merge into a PURL-identified component
      — merging inherits its false positives into otherwise-clean data.
      Pre-warm depcheck-data; a cold first sync will blow the job deadline.

# ============================================================================
# CBOM / QBOM
# ============================================================================

  - id: cbomkit-theia
    role: generator
    families: [cbom, qbom]
    upstream: https://github.com/PQCA/cbomkit-theia     # NOT github.com/cbomkit/*
    license: Apache-2.0
    version: "0.5.0"
    container: { image: ghcr.io/pqca/cbomkit-theia, digest: TBD }
    binary:
      url_template: https://github.com/PQCA/cbomkit-theia/releases/download/v{version}/cbomkit-theia_{os}_{arch}.tar.gz
      checksum_file: https://github.com/PQCA/cbomkit-theia/releases/download/v{version}/checksums.txt
      cosign: false
      sha256: { linux_amd64: TBD, windows_amd64: TBD, darwin_arm64: TBD }
    source_kinds: [git, upload, image]
    produces: [crypto_assets]
    native_format: cyclonedx-json-1.6
    default_weight: 5
    notes: >
      PRIMARY CBOM discovery — directories and container images; certificates,
      keys, secrets, java.security.
      ORG CORRECTION: canonically PQCA/ (Post-Quantum Cryptography Alliance,
      Linux Foundation) following IBM's donation. The original plan used a
      `cbomkit/` org and would have failed at acquisition.
      Output schema is early and moving: parse defensively, ignore unknown
      fields, diagnose missing ones, never panic.

  - id: cbomkit
    role: service
    families: [cbom]
    upstream: https://github.com/PQCA/cbomkit
    license: Apache-2.0
    version: "1.3.0"
    container: { image: ghcr.io/pqca/cbomkit, digest: TBD }
    container_only: true
    container_only_reason: "Java 17+ service"
    enabled: false
    optional: true
    notes: Managed clone-and-scan service with a viewer. Not required for MVP.

  - id: sonar-cryptography
    role: deferred
    families: [cbom]
    upstream: https://github.com/PQCA/sonar-cryptography
    license: Apache-2.0
    enabled: false
    deferred_reason: >
      This is a SonarQube PLUGIN, not a CLI. It requires a running SonarQube
      server — a heavyweight Java service the original plan never accounted for.
      cbomkit-theia covers directory and image discovery without it.
      Revisit post-MVP if deep Java/Python source crypto inventory is needed.

# ============================================================================
# AIBOM
# ============================================================================

  - id: ai-bom
    role: generator
    families: [aibom]
    upstream: https://github.com/Trusera/ai-bom
    license: Apache-2.0
    version: "0.9.0"
    pip:
      package: ai-bom                   # pip-installable — no clone needed
      version: "0.9.0"
      hashes: TBD
    source_kinds: [git, upload]
    produces: [ai_models, ai_dependencies]
    native_format: cyclonedx-json-1.6
    default_weight: 5
    notes: >
      Code-level AI discovery: LLM providers (OpenAI, Anthropic, Google,
      Mistral, Cohere, Ollama), agent frameworks (LangChain, CrewAI, AutoGen,
      LlamaIndex, LangGraph), MCP servers, model references, AI containers.
      `--llm-enrich` resolves concrete model names but needs an LLM key AND
      sends code context to a third party. OFF by default (AIBOM_LLM_ENRICH).

  - id: aibom-generator
    role: generator
    families: [aibom]
    upstream: https://github.com/GenAI-Security-Project/aibom-generator
    license: Apache-2.0
    version: "main"                     # pin to a tag before production
    pip: { git: "https://github.com/GenAI-Security-Project/aibom-generator", ref: TBD }
    source_kinds: [model_ref]
    produces: [ai_models]
    native_format: cyclonedx-json-1.6
    default_weight: 3
    notes: >
      OWASP GenAI Security Project (formerly aetheris-ai/aibom-generator).
      Model-metadata AIBOM from Hugging Face: model card, config, license, and
      a completeness score. Complements ai-bom — that finds usage in code, this
      enriches the referenced models. Both emit CycloneDX 1.6, so merge is clean.

# ============================================================================
# HBOM — no scanner exists. Structured import only. Label honestly in the UI.
# ============================================================================

  - id: hbom-csv
    role: importer
    families: [hbom]
    upstream: internal
    license: proprietary
    source_kinds: [upload]
    produces: [hardware_components]
    default_weight: 5
    notes: >
      CSV/spreadsheet import (StockFlow-shaped or generic). Expected columns:
      level, part_number, description, quantity, manufacturer, mpn, supplier.
      `level` drives the recursive subcomponent tree.
      NO open-source tool discovers physical hardware. This is import, not
      discovery, and the UI must say so.

  - id: hbom-form
    role: importer
    families: [hbom]
    upstream: internal
    license: proprietary
    source_kinds: [manual]
    produces: [hardware_components]
    default_weight: 5

# ============================================================================
# Libraries — dependencies, not engines
# ============================================================================
libraries:
  - id: protobom
    upstream: https://github.com/protobom/protobom
    license: Apache-2.0
    kind: go_module
    version: "v0.5.2"
    used_by: report-svc
    notes: >
      OpenSSF Go library for format-neutral BOM representation. This is the
      SPDX <-> CycloneDX SERIALIZATION LAYER in the report phase.
      The original plan classified it as an AIBOM generator — wrong phase,
      wrong kind of artifact entirely.

  - id: bomctl
    upstream: https://github.com/bomctl/bomctl
    license: Apache-2.0
    kind: cli
    version: "0.4.3"
    enabled: false
    optional: true
    notes: BOM merge/convert utility. Not a generator.

# ============================================================================
# External services — integrated, never scanners
# ============================================================================
services:
  - id: dependency-track
    upstream: https://github.com/DependencyTrack/dependency-track
    license: Apache-2.0
    kind: export_target
    enabled: false
    compose_profile: heavy
    containers:
      - { image: docker.io/dependencytrack/apiserver, digest: TBD }
      - { image: docker.io/dependencytrack/frontend,  digest: TBD }
    memory_min_gb: 4
    memory_recommended_gb: 12
    notes: >
      A full platform with its own database, API and UI that duplicates a large
      part of EncoreBOM. Integrated as an OPTIONAL EXPORT TARGET for portfolio
      monitoring — never as a scanner. Off by default; nothing in the core
      product depends on it.

# ============================================================================
# Part-data providers — pluggable, `manual` is the default
# ============================================================================
part_data_providers:
  - id: manual
    kind: builtin
    default: true
    notes: No external API. The default, so no paid service is ever a hard dependency.

  - id: nexar
    kind: rest_api
    base_url: https://api.nexar.com/graphql
    requires_env: [NEXAR_CLIENT_ID, NEXAR_CLIENT_SECRET]
    commercial: true
    notes: >
      Octopart's current API (Altium). Registration required, paid tiers,
      quota-limited. Cache aggressively, batch MPN lookups.

  - id: mouser
    kind: rest_api
    requires_env: [MOUSER_API_KEY]
    commercial: true

# ============================================================================
# Explicitly NOT used — recorded so nobody re-adds them
# ============================================================================
rejected:
  - id: django-bom
    upstream: https://github.com/mpkasp/django-bom
    license: GPL-3.0
    reason: >
      ⚠ GPL-3.0. Importing it would make hbom-worker a GPL derivative work.
      It is also a Django APPLICATION, not a library — it cannot be embedded.
      SCHEMA REFERENCE ONLY, never imported. See CLAUDE.md invariant 9.
      Our HBOM model is ~24 fields in a recursive tree; roughly 300 lines.

  - id: indabom
    upstream: https://github.com/mpkasp/indabom
    license: GPL-3.0
    reason: Django application wrapping django-bom. Same GPL problem. Reference only.

  - id: stockflow
    upstream: https://www.stockflowsystems.com
    reason: >
      Hosted SaaS with no public source. Integrated as a CSV IMPORT SHAPE
      (see hbom-csv), not as a dependency.

  - id: octopart
    upstream: https://octopart.com
    reason: >
      Commercial hosted API, now Nexar (Altium). Not OSINT. Available as an
      optional part-data provider, never required.
