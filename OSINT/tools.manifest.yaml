# ============================================================================
# AxeBOM — OSINT tool manifest
# ============================================================================
# The single machine-readable source of truth for every scanner AxeBOM
# invokes. Read by `axebom toolctl sync|verify|list`.
#
# Rationale: docs/ADR/0002-pinned-artifacts-no-source-builds.md
# Usage + failure modes: docs/04-OSINT-INTEGRATION.md
#
# ---------------------------------------------------------------------------
# RESOLVED AGAINST UPSTREAM 2026-08-16 (Phase 2)
# ---------------------------------------------------------------------------
# Every version below was read from the GitHub releases API, and every asset
# name from the actual release. Nothing here is a guess.
#
# The Phase 0 placeholders were ALL significantly stale — syft 1.19→1.51,
# grype 0.87→0.117, trivy 0.58→0.74, osv-scanner 2.0→2.5,
# dependency-check 11.1→13.0, ai-bom 0.9→3.1. This is exactly why the phase
# mandates resolving them rather than trusting a written-down guess.
#
# ---------------------------------------------------------------------------
# ⚠ ORG CORRECTION: cbomkit, NOT PQCA
# ---------------------------------------------------------------------------
# github.com/PQCA/* returns HTTP 301 and redirects to github.com/cbomkit/*.
# ghcr.io/cbomkit/cbomkit-theia resolves; ghcr.io/pqca/cbomkit-theia 404s.
#
# The Phase 0 planning notes claimed the opposite — that `cbomkit/` was wrong
# and `PQCA/` canonical — based on the PQCA donation announcement. The repos
# actually live under `cbomkit/`. Corrected here and in 04-OSINT-INTEGRATION.md.
#
# ---------------------------------------------------------------------------
# VERIFICATION MODEL
# ---------------------------------------------------------------------------
# We pin the VERSION and the CHECKSUM-FILE URL — not per-platform sha256
# literals. Reasons:
#
#   - Upstream publishes a signed checksums.txt covering every asset. Verifying
#     a download against it, and verifying THAT file's signature with cosign,
#     is the flow upstream itself recommends and is strictly stronger than a
#     hash we transcribed by hand.
#   - Hand-maintaining 6 tools x 3 platforms = 18 hashes per version bump is a
#     transcription surface that will eventually be wrong, and a wrong hash
#     fails closed in a way that looks like a network problem.
#
# `verify.checksum: required` means toolctl REFUSES to install without one.
# `verify.signature: required` means it refuses without a valid signature.
# Where upstream publishes neither, the tool carries an explicit
# `supply_chain_gap` and toolctl warns loudly on every sync. Never silently.
#
# ---------------------------------------------------------------------------
# RULES
# ---------------------------------------------------------------------------
# 1. Images are pinned by digest in production. `image_tag` is the resolution
#    hint; `image_digest` is filled by `toolctl pin` and is what sync uses.
# 2. Java tools are CONTAINER-ONLY. The primary dev machine has Java 1.8;
#    Dependency-Check needs 11+, cbomkit needs 17+. Do not add a local path.
# 3. Resolution order: container -> binary -> `unavailable`. A missing engine
#    NEVER fails a whole scan; it is recorded in Engine Coverage.
# ============================================================================

manifest:
  version: 2
  updated: "2026-08-16"
  resolved_against_network: true
  tools_dir: .axebom/tools

# ⚠ `default_weight` HERE MIRRORS services/scan-orchestrator/internal/policy
# /registry.go, WHICH IS AUTHORITATIVE.
#
# The weight is a share of a scan's PROGRESS PERCENTAGE, and only the
# orchestrator computes progress — nothing reads the value from this file. The
# two disagreed for every engine (syft 5 vs 3, grype 4 vs 3, dependency-check
# 2 vs 1, ...), which meant this file documented a progress model the product
# does not use. Aligned rather than deleted, so a reader of the manifest sees
# the real number; the Go registry remains the one to change.

defaults:
  mode_preference: [container, binary]
  verify:
    checksum: required
    signature: preferred     # `required` once cosign is installed everywhere

# ============================================================================
# SBOM
# ============================================================================
tools:

  - id: syft
    role: generator
    families: [sbom]
    upstream: https://github.com/anchore/syft
    license: Apache-2.0
    version: "1.51.0"
    container:
      image: docker.io/anchore/syft
      image_tag: "v1.51.0"
      image_digest: null          # `toolctl pin` fills this
    binary:
      # goreleaser naming: syft_1.51.0_linux_amd64.tar.gz
      url_template: https://github.com/anchore/syft/releases/download/v{version}/syft_{version}_{os}_{arch}.{ext}
      ext: { linux: tar.gz, darwin: tar.gz, windows: zip }
      checksum_file: https://github.com/anchore/syft/releases/download/v{version}/syft_{version}_checksums.txt
      signature:
        kind: cosign-keyless
        sig: "{checksum_file}.sig"
        cert: "{checksum_file}.pem"
    source_kinds: [git, upload, image]
    produces: [components, licenses]
    native_format: cyclonedx-json-1.6
    also_emits: [spdx-json-2.3]
    default_weight: 3
    db_backed: false
    notes: >
      PRIMARY SBOM generator; emits CycloneDX and SPDX natively, so we parse the
      standard document rather than screen-scraping. Version metadata is
      injected by goreleaser ldflags — a source build reports "unknown", which
      is why ADR-0002 forbids one.

  - id: cdxgen
    role: generator
    families: [sbom]
    upstream: https://github.com/cdxgen/cdxgen
    license: Apache-2.0
    version: "13.0.1"
    container:
      image: ghcr.io/cdxgen/cdxgen
      # ⚠ NO `v` PREFIX. The GitHub RELEASE is tagged `v13.0.1`; the container
      # registry publishes `13.0.1`, `v13` and `latest` but NOT `v13.0.1`.
      # Guessing the image tag from the release tag gives a 404 at pull time —
      # the identical trap this manifest already records for cbomkit-theia.
      # Probed against the real registry, 2026-09-03.
      image_tag: "13.0.1"
      # ⚠ THE FIRST PINNED DIGEST IN THIS MANIFEST, AND IT WAS SET BY HAND.
      #
      # Every other entry says "`toolctl pin` fills this" and every other entry
      # is null, because THAT COMMAND HAS NEVER EXISTED — `axebom toolctl`
      # offers list|dryrun|pull|sync|verify|licenses and nothing else. So the
      # manifest's own "pin by digest, never by tag" rule has been unenforced
      # since it was written, and every engine runs tag-addressed while
      # `SandboxedAdapter.classify()` honestly reports ENGINE_IMAGE_NOT_PINNED.
      #
      # This one is pinned because it could be: read from the registry manifest
      # at pull time and cross-checked against the local daemon's RepoDigest.
      # The missing command is recorded in docs/STATE.md rather than papered
      # over by pinning the rest from memory.
      image_digest: "sha256:0be75639a833b59d1ba29b3c8ac00dfd2e41e7568d56b6c039007caadebebc0d"
    container_only: true
    container_only_reason: >
      A Node runtime plus dozens of per-ecosystem helpers. The npm package is
      published, but installing it locally would put an unpinned transitive
      closure on the worker host — exactly what ADR-0002 exists to prevent.
    source_kinds: [git, upload]
    produces: [components, licenses]
    native_format: cyclonedx-json-1.6
    default_weight: 3
    db_backed: false
    verify:
      checksum: unavailable
      signature: unavailable
    supply_chain_gap: >
      Distributed as a container image and an npm package; upstream publishes
      no standalone checksums file and no cosign signature for either. Pinning
      the image by DIGEST via `toolctl pin` is the available mitigation and is
      what production must use — a tag is mutable.
    notes: >
      A SECOND, INDEPENDENT inventory alongside syft. Its graph trust ranks
      BELOW syft's in every shared ecosystem: the normalizer replaces a
      subgraph by trust rank rather than unioning, and syft is the engine this
      codebase has actually run against real projects.
      ⚠ Runs with FETCH_LICENSE=false under `--network=none`, and never
      resolves dependencies by executing package managers — the sandbox's
      CheckCommand refuses that for every engine, not just this one.

  - id: grype
    role: vulnerability
    families: [sbom]
    upstream: https://github.com/anchore/grype
    license: Apache-2.0
    version: "0.117.0"
    container:
      image: docker.io/anchore/grype
      image_tag: "v0.117.0"
      image_digest: null
    binary:
      url_template: https://github.com/anchore/grype/releases/download/v{version}/grype_{version}_{os}_{arch}.{ext}
      ext: { linux: tar.gz, darwin: tar.gz, windows: zip }
      checksum_file: https://github.com/anchore/grype/releases/download/v{version}/grype_{version}_checksums.txt
      signature:
        kind: cosign-keyless
        sig: "{checksum_file}.sig"
        cert: "{checksum_file}.pem"
    source_kinds: [sbom]
    produces: [vulnerabilities]
    emits_id_namespaces: [GHSA, CVE, OSV]
    default_weight: 3
    db_backed: true
    db_refresh: daily
    notes: >
      Runs against OUR syft SBOM, not the directory — re-scanning would produce
      a second, subtly different inventory to reconcile. A grype-db schema bump
      can break a pinned binary outright: emit ENGINE_DB_STALE and mark
      unavailable rather than emit stale matches.

  - id: trivy-fs
    role: hybrid
    families: [sbom]
    upstream: https://github.com/aquasecurity/trivy
    license: Apache-2.0
    version: "0.74.0"
    container:
      image: ghcr.io/aquasecurity/trivy
      image_tag: "0.74.0"
      image_digest: null
    binary:
      # NOTE the capitalisation: Linux-64bit / macOS-64bit but windows-64bit.
      # Not a typo — trivy's goreleaser config is inconsistent across platforms.
      url_template: https://github.com/aquasecurity/trivy/releases/download/v{version}/trivy_{version}_{os_trivy}.{ext}
      os_trivy: { linux: Linux-64bit, darwin: macOS-64bit, windows: windows-64bit }
      ext: { linux: tar.gz, darwin: tar.gz, windows: zip }
      checksum_file: https://github.com/aquasecurity/trivy/releases/download/v{version}/trivy_{version}_checksums.txt
      signature:
        # trivy migrated to sigstore bundles; there is no .sig/.pem pair.
        kind: sigstore-bundle
        bundle: "{checksum_file}.sigstore.json"
    mode: fs
    source_kinds: [git, upload]
    produces: [components, vulnerabilities, licenses, secrets]
    native_format: cyclonedx-json-1.6
    emits_id_namespaces: [CVE, GHSA]
    default_weight: 3
    db_backed: true
    security_note: >
      ⚠ Trivy's distribution channel was compromised twice in a coordinated
      attack in March 2026. Checksum AND signature verification are mandatory
      here, and the image is pinned by digest rather than tag.

  - id: trivy-image
    role: hybrid
    families: [sbom]
    upstream: https://github.com/aquasecurity/trivy
    license: Apache-2.0
    version: "0.74.0"
    container:
      image: ghcr.io/aquasecurity/trivy
      image_tag: "0.74.0"
      image_digest: null
    mode: image
    source_kinds: [image]
    produces: [components, vulnerabilities, licenses]
    native_format: cyclonedx-json-1.6
    default_weight: 3
    db_backed: true
    notes: >
      Deliberately a SEPARATE engine from trivy-fs: different invocation,
      different capabilities, different parser. The unit is (tool, mode).

  - id: osv-scanner
    role: vulnerability
    families: [sbom]
    upstream: https://github.com/google/osv-scanner
    license: Apache-2.0
    version: "2.5.0"
    container:
      image: ghcr.io/google/osv-scanner
      image_tag: "v2.5.0"
      image_digest: null
    binary:
      # Bare binaries, no archive.
      url_template: https://github.com/google/osv-scanner/releases/download/v{version}/osv-scanner_{os}_{arch}{exe}
      exe: { linux: "", darwin: "", windows: ".exe" }
      checksum_file: null
      signature: null
    verify:
      checksum: unavailable
      signature: unavailable
    supply_chain_gap: >
      ⚠ osv-scanner publishes NO checksum file and NO signatures on its release
      assets. The binary therefore cannot be verified the way every other tool
      here is. CONTAINER MODE IS PREFERRED for this engine specifically —
      ghcr.io images are content-addressed by digest, which restores the
      guarantee. toolctl warns on every sync that resolves it to a binary.
    source_kinds: [git, upload, sbom]
    produces: [vulnerabilities]
    emits_id_namespaces: [OSV, GO, PYSEC, RUSTSEC, MAL, GHSA, CVE]
    default_weight: 2
    db_backed: true
    notes: >
      The richest source of ALIAS EDGES — its `aliases` field is authoritative
      input to the union-find in 03-NORMALIZER-SPEC.md §2. Losing it is
      expensive to notice: the symptom is inflated counts, not an error.

  - id: dependency-check
    role: vulnerability
    families: [sbom]
    upstream: https://github.com/dependency-check/DependencyCheck
    license: Apache-2.0
    version: "13.0.0"
    container:
      image: docker.io/owasp/dependency-check
      image_tag: "13.0.0"
      image_digest: null
    binary: null
    container_only: true
    container_only_reason: "Java 11+ required; primary dev machine has Java 1.8"
    source_kinds: [git, upload]
    produces: [components, vulnerabilities]
    identity_kind: cpe
    emits_id_namespaces: [CVE]
    default_weight: 1
    db_backed: true
    requires_env: [NVD_API_KEY]
    requires_volume: depcheck-data
    first_run_minutes: [30, 60]
    notes: >
      Emits CPEs with a confidence field. A LOW-confidence CPE attaches as a
      CANDIDATE IDENTITY and must NEVER merge into a PURL-identified component —
      merging inherits its false positives into otherwise-clean data.
      Pre-warm depcheck-data; a cold first sync blows the job deadline.

# ============================================================================
# CBOM / QBOM  —  org is `cbomkit`, not `PQCA` (see header)
# ============================================================================

  - id: cbomkit-theia
    role: generator
    families: [cbom, qbom]
    upstream: https://github.com/cbomkit/cbomkit-theia
    license: Apache-2.0
    version: "1.1.2"
    container:
      image: ghcr.io/cbomkit/cbomkit-theia
      # NO `v` PREFIX. This read "v1.1.2" and 404'd at the registry.
      #
      # The two cbomkit repositories disagree with each other: cbomkit-theia
      # publishes 1.0.3 / 1.1.2, while its sibling cbomkit publishes 2.1.11 /
      # 2.2.0 — same org, same release tooling, and only one of them would have
      # matched a `v`-prefixed guess. The version itself was correct all along,
      # so the failure looked like a withdrawn release rather than a typo.
      #
      # Same class of trap as Trivy's Linux-64bit / windows-64bit asset naming,
      # already recorded in docs/STATE.md: never assume a project is internally
      # consistent about its own naming. Probe it.
      image_tag: "1.1.2"
      image_digest: null
    binary: null
    container_only: true
    container_only_reason: >
      Releases are source-only — v1.1.2 ships NO binary assets. The container
      is the only distributed artifact, so container mode is not a preference
      here, it is the only option.
    source_kinds: [git, upload, image]
    produces: [crypto_assets]
    native_format: cyclonedx-json-1.6
    default_weight: 3
    notes: >
      PRIMARY CBOM discovery — directories and container images; certificates,
      keys, secrets, java.security. Output schema is early and moving: parse
      defensively, ignore unknown fields, diagnose missing ones, never panic.

  - id: cbomkit
    role: service
    families: [cbom]
    upstream: https://github.com/cbomkit/cbomkit
    license: Apache-2.0
    version: "2.2.0"
    container:
      image: ghcr.io/cbomkit/cbomkit
      image_tag: "2.2.0"
      image_digest: null
    container_only: true
    container_only_reason: "Java 17+ service"
    enabled: false
    optional: true
    notes: Managed clone-and-scan service with a viewer. Not required for MVP.

  - id: sonar-cryptography
    role: deferred
    families: [cbom]
    upstream: https://github.com/cbomkit/sonar-cryptography
    license: Apache-2.0
    version: "1.6.1"
    enabled: false
    deferred_reason: >
      This is a SonarQube PLUGIN, not a CLI. It requires a running SonarQube
      server — a heavyweight Java service the original plan never accounted
      for. cbomkit-theia covers directory and image discovery without it.
      Revisit post-MVP if deep Java/Python source crypto inventory is needed.

# ============================================================================
# AIBOM
# ============================================================================

  - id: ai-bom
    role: generator
    families: [aibom]
    upstream: https://github.com/Trusera/ai-bom
    license: Apache-2.0
    version: "3.1.0"
    # ⚠ CONTAINER, NOT PIP — EVEN THOUGH UPSTREAM ONLY PUBLISHES A PIP PACKAGE.
    #
    # AIBomAdapter (workers/aibom/adapters/ai_bom.py) subclasses
    # SandboxedAdapter: it runs THIRD-PARTY CODE over untrusted customer source,
    # which CLAUDE.md invariant 7 requires to happen in the sandbox
    # (--network=none, read-only rootfs, cap-drop ALL, non-root, quotas) — a
    # `pip:` entry gives ManifestResolver nothing to build a sandboxed
    # container invocation from, so as a pip package this engine could never
    # actually run.
    #
    # deploy/docker/engines/Dockerfile.ai-bom wraps the pip package in a
    # container built locally with `task osint:build-ai-bom`. There is no
    # upstream image, so there is no upstream digest to pin against — hence
    # `image_tag: dev`, honestly tag-pinned rather than falsely digest-pinned.
    # SandboxedAdapter.classify() already has a branch for exactly this case
    # (no registry digest resolves; "the image was probably built locally").
    container:
      image: axebom/ai-bom-engine
      image_tag: "dev"
      image_digest: null
    source_kinds: [git, upload]
    produces: [ai_models, ai_dependencies]
    native_format: cyclonedx-json-1.6
    default_weight: 2
    notes: >
      Code-level AI discovery: LLM providers, agent frameworks (LangChain,
      CrewAI, AutoGen, LlamaIndex, LangGraph), MCP servers, model references.
      `--llm-enrich` resolves concrete model names but needs an LLM key AND
      sends code context to a third party. OFF by default (AIBOM_LLM_ENRICH).
      Package hashes for the full dependency closure (23 packages) are pinned
      in deploy/docker/engines/ai-bom-requirements.lock.txt, verified with
      `pip install --require-hashes` against python:3.12-slim.

  - id: aibom-generator
    role: generator
    families: [aibom]
    upstream: https://github.com/GenAI-Security-Project/aibom-generator
    license: Apache-2.0
    version: "main"
    unpinned_reason: >
      ⚠ The repository publishes NO releases and NO tags. Pinning to a branch
      is not reproducible and violates ADR-0002 in spirit. `toolctl pin` records
      the resolved COMMIT SHA into pip.ref so a build is at least repeatable;
      until then this engine is best-effort and marked as such in reports.
      RESOLVED IN THIS SESSION (2026-08-25, real `pip install
      git+https://github.com/GenAI-Security-Project/aibom-generator`, real
      network): HEAD of `main` was commit
      9b8056a66c03d4f6cf707059b83b21f97923c27b. Recorded here as evidence for
      whoever runs `toolctl pin` next — NOT written to `pip.ref` below, since
      that is `toolctl pin`'s job to do programmatically, not a value to hand-copy.
    pip:
      git: "https://github.com/GenAI-Security-Project/aibom-generator"
      ref: null                # commit sha, filled by `toolctl pin`
    source_kinds: [model_ref]
    produces: [ai_models]
    native_format: cyclonedx-json-1.6
    default_weight: 3
    notes: >
      OWASP GenAI Security Project (formerly aetheris-ai/aibom-generator).
      Model-metadata AIBOM from Hugging Face. Complements ai-bom — that finds
      usage in code, this enriches the referenced models. Both emit
      CycloneDX 1.6, so the merge is clean.
      Installs as `owasp-aibom-generator` (pyproject `[project] name`), NOT
      `aibom-generator` — pip.git above is correct because it installs by URL,
      but do not later add a `pip.package: aibom-generator` entry expecting it
      to resolve on PyPI; this project is git-install-only. Its console script
      is `aibom` (singular, no hyphen) — distinct from Trusera's `ai-bom`
      console script above, so the two never collide on $PATH. Verified:
      `AIBOMService.generate_aibom()` does not check that a model id resolves
      on the Hub before fabricating a plausible-looking component from guessed
      defaults, and no layer of its API accepts a revision/pin argument — see
      `workers/aibom/adapters/aibom_generator_fetch.py`'s module docstring for
      both, and how the Fetcher guards against them.

# ============================================================================
# HBOM
#
# ⚠ THE HEADING HERE USED TO READ "no scanner exists. Structured import only."
# That was true while every HBOM engine read a CSV or a form, and it is no
# longer the whole truth: `hbom-ecad` parses the customer's own KiCad, Altium
# and OrCAD DESIGN FILES out of an upload or a connected repository, which is a
# real scan of documents they wrote — the same act as reading a committed
# lockfile for an SBOM.
#
# ⚠ WHAT REMAINS TRUE, AND IS THE ACTUAL HONEST LABEL: nothing here inspects
# PHYSICAL HARDWARE. No open-source tool looks at a device and enumerates its
# parts. A schematic is a drawing; a cdxgen host inventory is a report the
# customer's own machine produced. Neither is AxeBOM having examined hardware,
# and no UI string may say otherwise.
# ============================================================================

  - id: hbom-ecad
    role: generator
    families: [hbom]
    upstream: internal
    license: proprietary
    source_kinds: [git, upload]
    produces: [hardware_components]
    native_format: axebom-hbom-json-1
    mode: internal
    default_weight: 3
    notes: >
      Parses hardware DESIGN files the customer wrote: KiCad `.kicad_sch`
      schematics, KiCad netlist XML, and BOM exports (KiCad, Altium, OrCAD,
      generic CSV/TSV). Placements are grouped into line items — R1, R4 and R17
      of the same 10k resistor become one row with quantity 3 and all three
      designators, because that is what gets ordered and placed. Grouping is by
      MPN where one exists, otherwise by value AND footprint together; never by
      value alone, since a 10k 0402 and a 10k 0805 cannot substitute.
      No container, no third-party binary, no network. Bounded file/byte caps,
      symlinks never followed, XML entity declarations refused unparsed.

  - id: hbom-cdxgen-host
    role: importer
    families: [hbom]
    # ⚠ `internal`, BECAUSE AxeBOM IMPLEMENTS THIS ENGINE. It parses a document
    # the customer generated; it never runs cdxgen, and there is no artifact to
    # acquire. Pointing `upstream` at cdx-hbom named the format's ORIGIN, and
    # the Python ManifestAdapter reads the field as "resolve a container,
    # binary or pip package for this" — so the availability probe reported the
    # engine unavailable while it worked perfectly, which would have shown as a
    # false gap in the Engine Coverage panel. The URL belongs in notes, which
    # is where hbom-csv already keeps its own format references.
    upstream: internal
    license: proprietary
    format_reference: https://github.com/cdxgen/cdx-hbom
    source_kinds: [upload]
    produces: [hardware_components]
    native_format: cyclonedx-json-1.7
    mode: internal
    default_weight: 2
    notes: >
      ⚠ NOT RUN BY AxeBOM. `cdxgen -t hbom` inventories THE HOST IT RUNS ON —
      board, firmware, TPM, storage, NICs. Running it inside our sandbox would
      document AxeBOM's own container host and present it as the customer's
      hardware, so it is never invoked here. The customer runs it on the device
      they want documented and uploads the CycloneDX 1.7 result; this engine
      parses that document. The raw artifact is their file byte for byte.
      Confirmed against cdxgen/docs/HBOM.md, 2026-09.

  - id: hbom-csv
    role: importer
    families: [hbom]
    upstream: internal
    license: proprietary
    # ⚠ EMPTY, AND THAT IS WHAT KEEPS IT OUT OF SCAN FAN-OUT. This id names the
    # interactive REST path (POST /v1/hbom/preview, then
    # /v1/hbom/{projectId}/import), not a job. It declared `upload` while the
    # whole hbom family was refused at scan-create time, which was harmless
    # then and is not now: hbom-ecad made the family scannable, and
    # policy.Registry.Resolve filters candidates on source kind alone, so a
    # declared kind would publish scan.job.hbom for an engine no worker
    # implements. Mirrors registry.go's SourceKinds: nil.
    source_kinds: []
    produces: [hardware_components]
    default_weight: 1
    notes: >
      CSV/spreadsheet import (StockFlow-shaped or generic). Expected columns:
      level, part_number, description, quantity, manufacturer, mpn, supplier.
      `level` drives the recursive subcomponent tree.
      NO open-source tool discovers physical hardware. This is import, not
      discovery, and the UI must say so.

  - id: hbom-form
    role: importer
    families: [hbom]
    upstream: internal
    license: proprietary
    source_kinds: [manual]
    produces: [hardware_components]
    default_weight: 5

# ============================================================================
# WEB RECON — URL-registered projects only (Milestone 5, project-registration
# plan). subfinder runs inside services/webrecon's own sandboxed container,
# NEVER as a normal engine — CLAUDE.md invariant 7 and
# libs/go-shared/sandbox/policy.go both say flatly that no ENGINE may have
# network egress. webrecon-fingerprint (the registered SBOM engine,
# services/scan-orchestrator/internal/policy/registry.go) is Mode: internal —
# it only parses the JSON services/webrecon already produced, and needs no
# tool of its own.
# ============================================================================

  - id: subfinder
    role: discovery
    families: [sbom]
    upstream: https://github.com/projectdiscovery/subfinder
    license: MIT
    version: "2.16.0"
    container:
      image: docker.io/projectdiscovery/subfinder
      image_tag: "v2.16.0"
      image_digest: null          # `toolctl pin` fills this
    binary:
      # goreleaser naming: subfinder_2.16.0_linux_amd64.zip
      url_template: https://github.com/projectdiscovery/subfinder/releases/download/v{version}/subfinder_{version}_{os}_{arch}.zip
      ext: { linux: zip, darwin: zip, windows: zip }
      checksum_file: https://github.com/projectdiscovery/subfinder/releases/download/v{version}/subfinder_{version}_checksums.txt
    verify:
      checksum: required
      signature: unavailable
    supply_chain_gap: >
      subfinder publishes a checksums.txt but no cosign signature or SLSA
      provenance for this release — checksum-only verification, same gap
      class as osv-scanner. Container mode is preferred where available:
      ghcr.io/docker.io images are content-addressed by digest.
    source_kinds: [url]
    produces: [hostnames]
    default_weight: 2
    db_backed: false
    notes: >
      Passive subdomain enumeration ONLY — queries public sources (crt.sh,
      certificate transparency logs, DNS aggregators), never brute-forces or
      actively probes. Run by services/webrecon inside its own
      sandbox.Runner container, network-egress policy (the same posture the
      fetcher's git clone gets — see services/webrecon/internal/discover),
      capped by project.web_sources.max_hosts. Its JSON output is never
      ingested directly; services/webrecon fetches and JS-fingerprints each
      discovered host itself, and THAT combined result — not subfinder's raw
      output — is what webrecon-fingerprint parses.

# ============================================================================
# Libraries — dependencies, not engines
# ============================================================================
libraries:
  - id: retire-js-signatures
    upstream: https://github.com/RetireJS/retire.js
    license: Apache-2.0
    kind: data
    version: "commit db79fa77c86e24d91c9ce1934ad9f2a640242774 (2026-08-20)"
    used_by: services/webrecon
    notes: >
      The retire.js vulnerable-JS-library signature database
      (repository/jsrepository.json), vendored verbatim at
      services/webrecon/internal/fingerprint/signatures/retire-js-jsrepository.json rather than toolctl-managed — a
      single JSON data file does not fit the binary/container pinning
      machinery built for goreleaser-style executable releases. Full
      provenance (source commit, sha256, fetch date) and the RE2/PCRE
      compatibility spike's findings are in
      services/webrecon/internal/fingerprint/signatures/PROVENANCE.md. Matched by a Go-native
      engine (services/webrecon/internal/fingerprint/retire.go), not
      retire.js's own Node CLI — embedding a Node runtime inside a
      network-enabled sandboxed container would roughly double that
      container's attack surface for no benefit.
  - id: protobom
    upstream: https://github.com/protobom/protobom
    license: Apache-2.0
    kind: go_module
    version: "v0.5.8"
    used_by: report-svc
    notes: >
      OpenSSF Go library for format-neutral BOM representation. This is the
      SPDX <-> CycloneDX SERIALIZATION LAYER in the report phase.
      The original plan classified it as an AIBOM generator — wrong phase,
      wrong kind of artifact entirely.

  - id: bomctl
    upstream: https://github.com/bomctl/bomctl
    license: Apache-2.0
    kind: cli
    version: "v0.4.3"
    enabled: false
    optional: true
    notes: BOM merge/convert utility. Not a generator.

# ============================================================================
# External services — integrated, never scanners
# ============================================================================
services:
  - id: dependency-track
    upstream: https://github.com/DependencyTrack/dependency-track
    license: Apache-2.0
    kind: export_target
    version: "5.0.4"
    enabled: false
    compose_profile: heavy
    containers:
      - { image: docker.io/dependencytrack/apiserver, image_tag: "5.0.4", image_digest: null }
      - { image: docker.io/dependencytrack/frontend,  image_tag: "5.0.4", image_digest: null }
    memory_min_gb: 4
    memory_recommended_gb: 12
    notes: >
      A full platform with its own database, API and UI that duplicates a large
      part of AxeBOM. Integrated as an OPTIONAL EXPORT TARGET for portfolio
      monitoring — never as a scanner. Off by default; nothing in the core
      product depends on it.

# ============================================================================
# Part-data providers — pluggable, `manual` is the default
# ============================================================================
part_data_providers:
  - id: manual
    kind: builtin
    default: true
    notes: No external API. The default, so no paid service is ever a hard dependency.

  - id: nexar
    kind: rest_api
    base_url: https://api.nexar.com/graphql
    requires_env: [NEXAR_CLIENT_ID, NEXAR_CLIENT_SECRET]
    commercial: true
    notes: >
      Octopart's current API (Altium). Registration required, paid tiers,
      quota-limited. Cache aggressively, batch MPN lookups.

  - id: mouser
    kind: rest_api
    requires_env: [MOUSER_API_KEY]
    commercial: true

# ============================================================================
# Explicitly NOT used — recorded so nobody re-adds them
# ============================================================================
rejected:
  - id: django-bom
    upstream: https://github.com/mpkasp/django-bom
    license: GPL-3.0
    reason: >
      ⚠ GPL-3.0. Importing it would make hbom-worker a GPL derivative work.
      It is also a Django APPLICATION, not a library — it cannot be embedded.
      SCHEMA REFERENCE ONLY, never imported. See CLAUDE.md invariant 9.
      Our HBOM model is ~24 fields in a recursive tree; roughly 300 lines.

  - id: indabom
    upstream: https://github.com/mpkasp/indabom
    license: GPL-3.0
    reason: Django application wrapping django-bom. Same GPL problem. Reference only.

  - id: stockflow
    upstream: https://www.stockflowsystems.com
    reason: >
      Hosted SaaS with no public source. Integrated as a CSV IMPORT SHAPE
      (see hbom-csv), not as a dependency.

  - id: freebom
    upstream: https://github.com/alekssadowski95/FreeBOM
    license: LGPL-2.1
    reason: >
      ⚠ LGPL-2.1 — copyleft, and CLAUDE.md invariant 9 permits copyleft only in
      a subprocess or a separate service, never imported. It is also moot: the
      repository contains LICENSE, README.md and requirements.txt and NO
      LIBRARY AT ALL, so there is nothing to import even if the licence
      allowed it. Its capability — multi-level assembly and sub-assembly
      management — is the recursive `parent_id` tree AxeBOM already has.
      Checked against the GitHub API 2026-09-03.

  - id: kicad-multi-bom-plugin
    upstream: https://github.com/Kenneract/KiCAD-Multi-BOM-Plugin
    license: GPL-3.0
    reason: >
      ⚠ GPL-3.0. Importing it would make the HBOM worker a derivative work
      (invariant 9). Unmaintained since October 2024. Its capability —
      splitting one BOM into per-supplier files, including a JLCPCB-PCBA
      compatible layout — is roughly 300 lines of grouping and formatting and
      is being built natively instead, the same decision django-bom got.
      Checked against the GitHub API 2026-09-03.

  - id: kibom
    upstream: https://github.com/SchrodingersGat/KiBoM
    license: MIT
    reason: >
      Licence is fine; the artifact is not. Upstream ARCHIVED the repository in
      March 2025, so a pin here would be one that can never receive a fix — in
      a supply chain whose entire discipline is pinned, verifiable, MAINTAINED
      releases (ADR-0002). Its KiCad netlist grouping rule is about thirty
      lines and is reimplemented in workers/hbom/adapters/kicad.py, with this
      note recording where it came from. FORMAT REFERENCE ONLY.
      Checked against the GitHub API 2026-09-03.

  - id: octopart
    upstream: https://octopart.com
    reason: >
      Commercial hosted API, now Nexar (Altium). Not OSINT. Available as an
      optional part-data provider, never required.
