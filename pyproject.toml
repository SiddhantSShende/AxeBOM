[project]
name = "axebom-shared"
version = "0.1.0"
description = "Shared library for AxeBOM scan workers"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Deliberately minimal. Every dependency added here is one more thing to keep
# pinned across five worker images, and one more entry in AxeBOM's own SBOM
# — a BOM platform that cannot produce a clean BOM of itself is not credible.
dependencies = [
    "pydantic>=2.9",
    "structlog>=24.4",
    # The adapter registry and the sbom worker parse OSINT/tools.manifest.yaml
    # at import time. Undeclared, this resolves only on a machine that happens
    # to have PyYAML already — every clean install fails at `import yaml`.
    "pyyaml>=6.0",
    # JetStream client for the worker consumer loop. The topology is owned by
    # libs/go-shared/bus/bus.go (docs/02-CONTRACTS.md §2 is the SSOT); this side
    # only attaches consumers and publishes results to it.
    "nats-py>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    # Validates worker output against proto/schemas/*.json, which are GENERATED
    # from the Go types in libs/go-shared/events. That is the point: it catches
    # the Python worker and the Go orchestrator drifting apart at the envelope,
    # which is otherwise only discovered when a result is silently dropped.
    "jsonschema>=4.23",
    # normalize.writer/cluster_store/normalize_consumer execute real SQL
    # against Postgres — needed here so those modules are testable from a
    # developer's environment. See the `normalize-consumer` extra below for
    # the one PRODUCTION image that also needs this.
    "psycopg[binary]>=3.2",
]

# Scanner adapters. Installed into the worker image, not into a developer's
# environment. Versions are pinned by OSINT/tools.manifest.yaml, which is the
# SSOT — these are the pip-installable subset.
scanners = [
    "ai-bom>=0.9",          # Trusera: code-level AI discovery (Phase 12)
]

# workers/aienrich — the ONE component in the AI path with outbound network.
#
# ⚠ DELIBERATELY NOT IN `scanners`, AND THAT SEPARATION IS THE POINT.
# `owasp-aibom-generator` pushes every model id it is asked about to a HARDCODED
# third-party Hugging Face dataset whenever HF_TOKEN is set (its own
# `src/utils/analytics.py` + `src/config.py`). Keeping it out of the image that
# processes customer repositories bounds what that package can ever see, and
# `workers/aienrich/runner.py::assert_no_telemetry_token` refuses to start with a
# token present.
#
# ⚠ INSTALLED FROM GIT AT A PINNED COMMIT, because the project publishes no
# releases, no tags and nothing on PyPI — `pip install owasp-aibom-generator`
# 404s. See `unpinned_reason` in OSINT/tools.manifest.yaml. The commit below was
# resolved against the real repository and re-verified this session.
# ⚠ INSTALLED WITH --no-deps IN THE IMAGE, AND THE SUBSET IS LISTED HERE.
#
# owasp-aibom-generator declares torch, transformers, datasets, sentencepiece,
# fastapi, flask, gunicorn and uvicorn as HARD RUNTIME DEPENDENCIES. Installing
# them pulled 3.2GB of NVIDIA CUDA libraries, 1.2GB of torch and 897MB of triton
# into a worker whose entire job is fetching JSON metadata over HTTPS — a 9.78GB
# image, measured, for an HTTP client.
#
# None of it is on the path we use. torch/transformers/sentencepiece serve
# `--summarize`, which downloads and RUNS a model (facebook/bart-large-cnn) —
# something this worker must never do. fastapi/flask/gunicorn/uvicorn serve the
# project's bundled web app (`python -m src.main`, port 8000), which we must
# never start; omitting them means it cannot be started even by accident.
#
# The subset below is what the CLI generate path actually imports, and
# `test_the_pinned_generator_still_produces_a_populated_card` proves it against
# the real API rather than against this reasoning.
aienrich = [
    "huggingface-hub>=0.34",
    "cyclonedx-python-lib[json-validation]>=11.7.0",
    "beautifulsoup4>=4.11.0",
    "packageurl-python>=0.11.1",
    "pydantic>=2.4.0",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "jinja2>=3.0.0",
    "safetensors>=0.4.0",
    # ⚠ NOT BECAUSE WE SERVE HTTP. `src/utils/__init__.py` eagerly imports
    # `rate_limiting`, which imports `fastapi`, so the CLI path cannot import the
    # package without it — an upstream coupling between the library and the
    # bundled web app. fastapi alone is small and starts nothing; gunicorn,
    # uvicorn and flask stay out, so the bundled server still cannot be run.
    "fastapi>=0.104.0",
]

# workers/sbom/normalize_consumer.py — the ONE deliberate exception to
# "workers hold no credentials" (axebom_shared.config's docstring). Its own
# Dockerfile (deploy/docker/Dockerfile.normalize-consumer) installs this
# extra; no other worker image does, so psycopg stays out of
# sbom-worker/cbom-worker/aibom-worker even though this package sits on
# their same dependency tree.
normalize-consumer = [
    "psycopg[binary]>=3.2",
]

# tools/conformance validates exported SPDX/CycloneDX documents against the
# OFFICIAL schemas — a correctness check, not a runtime dependency of
# anything shipped. Both are Apache-2.0 (CLAUDE.md invariant 9: no GPL in
# our binaries — moot here anyway, since neither ships).
conformance = [
    "cyclonedx-python-lib[json-validation]>=11.0",
    "spdx-tools>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["libs/py-shared"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["libs/py-shared", "workers"]

# ⚠ FIXTURE SOURCE IS NOT OUR SOURCE, AND FORMATTING IT BREAKS EVIDENCE.
#
# `workers/aibom/testdata/ai-langchain/` is a sample application AxeBOM SCANS.
# The captured engine outputs beside it — `airom-ai-langchain.cdx.json`,
# `cdxgen-ai-ai-langchain.cdx.json`, `ai-bom-langchain-llama3.cdx.json` — are
# real responses that cite `src/app.py:12`, `:17`, `:18` as the evidence for the
# models they found. `ruff format` inserted one blank line after the module
# docstring, which silently moved every one of those line numbers by one and
# made three real captures disagree with the file they were captured from.
#
# It is also the wrong thing to lint on its own terms: it is written to look
# like customer code, unused imports and all, because that is what it stands in
# for.
exclude = ["workers/*/testdata"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit — security
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetimes  <-- see below
    "PTH",      # pathlib over os.path
    "RUF",
]
ignore = [
    "E501",     # line length handled by the formatter
    "S603",     # subprocess call — running scanners IS the job; the sandbox
                # is the control, not a lint rule (docs/05-SECURITY-MODEL.md §3)
]

# DTZ is enabled deliberately and must stay on. CLAUDE.md: all timestamps are
# UTC RFC3339 with a literal Z. A naive datetime.now() in a worker produces a
# BOM timestamp in the container's local time, which is a compliance-artifact
# defect that no test would catch.

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]   # asserts and fake credentials
"**/test_*.py" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["libs/py-shared", "workers"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires the local stack (task dev)",
    "golden: normalizer golden-file comparison",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Scanner output is untyped JSON from third-party tools; adapters parse
# defensively and cannot promise types at the boundary.
disallow_any_expr = false
